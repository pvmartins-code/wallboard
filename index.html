            const r = m.match(/\b(\d{2})(\d{2})(\d{2})Z\b/);
            if (!r) return null;

            const z = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), parseInt(r[1], 10), parseInt(r[2], 10), parseInt(r[3], 10)));

            if (diff < 0) diff += 1440;
            return Math.round(diff);

        function parseGeneralWind(m) {
            const vrb = m.match(/VRB(\d{2})(?:G(\d{2}))?KT/);
            if (vrb) return { type: "VRB", spd: +vrb[1], gust: vrb[2] ? +vrb[2] : undefined };
            const fixed = m.match(/(\d{3})(\d{2})(?:G(\d{2}))?KT(?:\s+(\d{3})V(\d{3}))?/);
            if (fixed) return { type: "FIXED", dir: +fixed[1], spd: +fixed[2], gust: fixed[3] ? +fixed[3] : undefined, varFrom: fixed[4] ? +fixed[4] : undefined, varTo: fixed[5] ? +fixed[5] : undefined };
            return null;
        }

        function parseRunwayWinds(m) {
            const out = [];
            const re = /RWY(\d{2})\s+(?:(VRB)|(\d{3}))(\d{2})(?:G(\d{2}))?KT(?:\s+(\d{3})V(\d{3}))?/gi;
            let x;
            while ((x = re.exec(m))) {
                out.push({ rwy: x[1], type: x[2] ? "VRB" : "FIXED", dir: x[3] ? +x[3] : undefined, spd: +x[4], gust: x[5] ? +x[5] : undefined, varFrom: x[6] ? +x[6] : undefined, varTo: x[7] ? +x[7] : undefined });
            }
            return out;
        }

        function parseVisAndCeiling(metar) {
            let vis = null;
            let isCavok = false;
            let rawVisText = "--";
            let ceiling = null;
            let rawCeilingText = "CÉU LIMPO";
            let ceilingLayer = null;
            let rvrMap = {};

            if (!metar) return { vis, isCavok, rawVisText, ceiling, rawCeilingText, ceilingLayer, rvrMap };

            if (/\bCAVOK\b/.test(metar)) {
                isCavok = true;
                vis = 9999;
                rawVisText = "CAVOK (≥10km)";
                ceiling = null;
                rawCeilingText = "CAVOK (S/Teto <5000')";
                return { vis, isCavok, rawVisText, ceiling, rawCeilingText, ceilingLayer: null, rvrMap };
            }

            const rvrRegex = /\bR(\d{2}[LCR]?)\/([MP])?(\d{4})(?:V([MP])?(\d{4}))?[NUD]?\b/g;
            let rvrMatch;
            while ((rvrMatch = rvrRegex.exec(metar)) !== null) {
                const rwyNum = rvrMatch[1].replace(/[LCR]/, '');
                const rvrVal = parseInt(rvrMatch[3], 10);
                rvrMap[rwyNum] = rvrVal;
            }

            const tokens = metar.split(/\s+/);
            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                const visMeterMatch = token.match(/^(\d{4})(?:NDV|[NSEW]{1,2})?$/);
                if (visMeterMatch) {
                    const parsedMeters = parseInt(visMeterMatch[1], 10);
                    if (!token.endsWith("Z") && !token.startsWith("Q") && !token.startsWith("RWY")) {
                        vis = parsedMeters;
                        rawVisText = parsedMeters >= 9999 ? "≥10km" : `${parsedMeters}m`;
                        break;
                    }
                }
                const smFractionMatch = token.match(/^(\d+)\/(\d+)SM$/);
                if (smFractionMatch) {
                    const frac = parseInt(smFractionMatch[1], 10) / parseInt(smFractionMatch[2], 10);
                    const meters = Math.round(frac * 1609);
                    vis = meters;
                    rawVisText = `${token} (~${meters}m)`;
                    break;
                }
                const smWholeMatch = token.match(/^(\d+)SM$/);
                if (smWholeMatch) {
                    const miles = parseInt(smWholeMatch[1], 10);
                    const meters = Math.round(miles * 1609);
                    vis = meters;
                    rawVisText = `${token} (~${meters}m)`;
                    break;
                }
            }

            const vvMatch = metar.match(/\bVV(\d{3}|\/\/\/)\b/);
            if (vvMatch) {
                if (vvMatch[1] === "///") {
                    ceiling = 0;
                    ceilingLayer = "VV///";
                    rawCeilingText = "VV/// (0 ft - Obscurecido)";
                } else {
                    const vvFt = parseInt(vvMatch[1], 10) * 100;
                    ceiling = vvFt;
                    ceilingLayer = `VV${vvMatch[1]}`;
                    rawCeilingText = `VV ${vvFt} ft`;
                }
            }

            const cloudRegex = /\b(BKN|OVC)(\d{3})(?:CB|TCU)?\b/g;
            let cMatch;
            while ((cMatch = cloudRegex.exec(metar)) !== null) {
                const type = cMatch[1];
                const heightFt = parseInt(cMatch[2], 10) * 100;
                if (ceiling === null || heightFt < ceiling) {
                    ceiling = heightFt;
                    ceilingLayer = `${type}${cMatch[2]}`;
                    rawCeilingText = `${type} ${heightFt} ft`;
                }
            }

            if (ceiling === null) {
                if (/\b(SKC|NSC|NCD)\b/.test(metar)) {
                    rawCeilingText = "S/ TETO (NSC/SKC)";
                } else if (/\b(FEW|SCT)\d{3}\b/.test(metar)) {
                    const lowestFewSct = metar.match(/\b(FEW|SCT)(\d{3})\b/);
                    rawCeilingText = lowestFewSct ? `S/ TETO (${lowestFewSct[1]}${lowestFewSct[2]})` : "S/ TETO";
                }
            }

            return { vis, isCavok, rawVisText, ceiling, rawCeilingText, ceilingLayer, rvrMap };
        }

        // --- POLAR CALCULATIONS & RUNWAY VISUAL SVG ---
        function polarToCartesian(cx, cy, r, angleDeg) {
            const rad = (angleDeg - 90) * Math.PI / 180.0;
            return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
        }

        function describeArc(cx, cy, r, startAngle, endAngle) {
            const start = polarToCartesian(cx, cy, r, startAngle);
            const end = polarToCartesian(cx, cy, r, endAngle);
            let diff = endAngle - startAngle;
            if (diff < 0) diff += 360;
            const largeArcFlag = diff <= 180 ? "0" : "1";
            return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`;
        }

        const RunwayVisual = ({ runwayHeading, bestRunway, selectedRunwayHdg, arrowDir, arcStartAngle, arcEndAngle }) => {
            const cx = 150;
            const cy = 150;
            const r = 90;
            const rwy1 = runwayHeading;
            const rwy2 = (runwayHeading + 180) % 360;
            const rwy1Pos = polarToCartesian(cx, cy, 122, runwayHeading - 180);
            const rwy2Pos = polarToCartesian(cx, cy, 122, runwayHeading);

            const isRwy1Active = selectedRunwayHdg !== null ? selectedRunwayHdg === rwy1 : bestRunway === rwy1;
            const isRwy2Active = selectedRunwayHdg !== null ? selectedRunwayHdg === rwy2 : bestRunway === rwy2;

            return (
                <svg viewBox="0 0 300 300" className="w-full h-full drop-shadow-sm select-none">
                    <g transform={`rotate(${runwayHeading - 90} ${cx} ${cy})`}>
                        <rect x={cx - 90} y={cy - 10} width="180" height="20" rx="3" className="fill-slate-700" />
                        <line x1={cx - 80} y1={cy} x2={cx + 80} y2={cy} className="stroke-white stroke-[2] [stroke-dasharray:8_8]" />
                        <g className="fill-white">
                            <rect x={cx - 88} y={cy - 8} width="4" height="16" />
                            <rect x={cx - 82} y={cy - 8} width="4" height="16" />
                            <rect x={cx + 84} y={cy - 8} width="4" height="16" />
                            <rect x={cx + 78} y={cy - 8} width="4" height="16" />
                        </g>
                    </g>
                    <text 
                        x={rwy1Pos.x} 
                        y={rwy1Pos.y} 
                        className={`text-3xl font-extrabold text-center dominant-baseline-middle transition-colors ${isRwy1Active ? 'fill-emerald-400 font-black' : 'fill-slate-500'}`} 
                        textAnchor="middle" 
                        dominantBaseline="middle"
                    >
                        {runwayNumber(rwy1)}
                    </text>
                    <text 
                        x={rwy2Pos.x} 
                        y={rwy2Pos.y} 
                        className={`text-3xl font-extrabold text-center dominant-baseline-middle transition-colors ${isRwy2Active ? 'fill-emerald-400 font-black' : 'fill-slate-500'}`} 
                        textAnchor="middle" 
                        dominantBaseline="middle"
                    >
                        {runwayNumber(rwy2)}
                    </text>
                    {arrowDir !== null && (
                        <g>
                            {arcStartAngle !== null && arcEndAngle !== null && (
                                <path d={describeArc(cx, cy, r, arcStartAngle, arcEndAngle)} fill="none" className="stroke-blue-400/30" strokeWidth="10" strokeLinecap="round" />
                            )}
                            <g transform={`rotate(${((arrowDir + 180) % 360) - 90} ${cx} ${cy})`}>
                                <line x1={cx - 80} y1={cy} x2={cx + 80} y2={cy} className="stroke-sky-400" strokeWidth="4" strokeLinecap="round" />
                                <polygon points={`${cx + 85},${cy} ${cx + 70},${cy - 6} ${cx + 70},${cy + 6}`} className="fill-sky-400" />
                            </g>
                        </g>
                    )}
                </svg>
            );
        };

        // --- AIRPORT CARD (USED IN LIVE WEATHER VIEW) ---
        const AirportCard = ({ airport, metarData, windLimitsData, approachLimitsData, alertWindEnabled, alertVisCeilingEnabled, onSelectRwy }) => {
            const { metar, error, loading } = metarData || {};
            const [manualRwy, setManualRwy] = useState(null);

            if (loading && !metar) {
                return (
                    <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-center h-full animate-pulse text-slate-400">
                        <div className="w-6 h-6 rounded-full border-2 border-blue-500 border-t-transparent animate-spin mb-2" />
                        <span className="text-xs font-medium">A carregar {airport.code}...</span>
                    </div>
                );
            }

            if (error && !metar) {
                return (
                    <div className="bg-slate-900 border-2 border-red-500/70 rounded-xl p-3 flex flex-col h-full justify-between">
                        <div className="flex justify-between items-center">
                            <div>
                                <h2 className="text-base font-bold tracking-widest text-white">{airport.code}</h2>
                                <span className="text-[10px] text-slate-400">{airport.name}</span>
                            </div>
                            <span className="text-xs font-bold px-2 py-0.5 bg-red-950 text-red-400 border border-red-800 rounded">ERRO METAR</span>
                        </div>
                        <div className="flex-1 flex items-center justify-center text-slate-400 font-mono text-xs">
                            Falha ao carregar METAR
                        </div>
                    </div>
                );
            }

            const age = metar ? metarAgeMinutes(metar) : null;
            const rain = metar ? hasRain(metar) : false;
            const lowVisPhenom = metar ? hasLowVisPhenomenon(metar) : false;
            const gen = metar ? parseGeneralWind(metar) : null;
            const rwyWinds = metar ? parseRunwayWinds(metar) : [];

            let arrow = null;
            let bestHdg = null;
            let windRed = false;
            let windAmber = false;
            const windRows = [];

            if (gen) {
                let limitStr = "— / —";
                let isRed = false;
                let isAmb = false;
                if (gen.type === "FIXED" && gen.dir !== undefined) {
                    const chk = gen.gust ?? gen.spd;
                    const data = windLimitsData[airport.code]?.[nearest10(gen.dir)];
                    if (data) {
                        limitStr = `${data.dry ?? "——"}kt / 💧${data.wet ?? "——"}kt`;
                        const limitToUse = rain && data.wet !== undefined ? data.wet : data.dry;
                        if (limitToUse !== undefined) {
                            if (chk > limitToUse) {
                                isRed = true;
                            } else if (chk >= limitToUse - 4) {
                                isAmb = true; // Amber when within 4kt of limit
                            }
                        }
                    }
                    arrow = gen;
                }
                windRows.push({ 
                    text: `METAR: ${gen.type === "VRB" ? "VRB" : fmtDir(gen.dir) + "°"}${gen.varFrom ? ` (${fmtDir(gen.varFrom)}–${fmtDir(gen.varTo)})` : ""} / ${gen.spd}${gen.gust ? `G${gen.gust}` : ""}kt`, 
                    limit: limitStr, 
                    isRed,
                    isAmb
                });
                if (isRed) windRed = true;
                if (isAmb) windAmber = true;
            }

            for (const w of rwyWinds) {
                const chk = w.gust ?? w.spd;
                const data = w.dir !== undefined ? windLimitsData[airport.code]?.[nearest10(w.dir)] : null;
                let limitStr = "— / —";
                let isRed = false;
                let isAmb = false;
                if (data) {
                    limitStr = `${data.dry ?? "——"}kt / 💧${data.wet ?? "——"}kt`;
                    const limitToUse = rain && data.wet !== undefined ? data.wet : data.dry;
                    if (limitToUse !== undefined) {
                        if (chk > limitToUse) {
                            isRed = true;
                        } else if (chk >= limitToUse - 4) {
                            isAmb = true;
                        }
                    }
                }
                windRows.push({ 
                    text: `RWY${w.rwy}: ${w.type === "VRB" ? "VRB" : fmtDir(w.dir) + "°"}${w.varFrom ? ` (${fmtDir(w.varFrom)}–${fmtDir(w.varTo)})` : ""} / ${w.spd}${w.gust ? `G${w.gust}` : ""}kt`, 
                    limit: limitStr, 
                    isRed,
                    isAmb
                });
                if (w.type === "FIXED" && (!arrow || chk > (arrow.gust ?? arrow.spd))) arrow = w;
                if (isRed) windRed = true;
                if (isAmb) windAmber = true;
            }

            const h1 = airport.rwy;
            const h2 = (airport.rwy + 180) % 360;
            if (arrow && arrow.dir !== undefined) {
                const spd = arrow.gust ?? arrow.spd;
                const headwind1 = spd * Math.cos(angleDiff(arrow.dir, h1) * Math.PI / 180);
                const headwind2 = spd * Math.cos(angleDiff(arrow.dir, h2) * Math.PI / 180);
                bestHdg = headwind1 >= headwind2 ? h1 : h2;
            } else {
                bestHdg = h1;
            }

            let arcFrom = null, arcTo = null;
            if (gen?.varFrom && gen?.varTo) { 
                arcFrom = gen.varFrom; 
                arcTo = gen.varTo; 
            } else {
                const bestRwyNumber = bestHdg ? runwayNumber(bestHdg) : null;
                const rwyInUse = rwyWinds.find(r => bestRwyNumber && r.rwy === bestRwyNumber && r.varFrom && r.varTo);
                if (rwyInUse) { arcFrom = rwyInUse.varFrom; arcTo = rwyInUse.varTo; }
            }

            const { vis, isCavok, rawVisText, ceiling, rawCeilingText, ceilingLayer, rvrMap } = parseVisAndCeiling(metar);
            const approaches = approachLimitsData[airport.code] || [];
            
            const naturalBestRwyNum = runwayNumber(bestHdg);
            const activeRwyNum = manualRwy || naturalBestRwyNum;

            let currentApproach = approaches.find(a => 
                a.rwy === activeRwyNum || 
                (airport.code === "SJZ" && ((activeRwyNum === "13" && a.rwy === "13") || (activeRwyNum === "31" && a.rwy === "31")))
            );
            if (!currentApproach && approaches.length > 0) {
                currentApproach = approaches[0];
            }

            const runwayRvr = rvrMap[activeRwyNum] !== undefined ? rvrMap[activeRwyNum] : null;
            const effectiveVis = runwayRvr !== null ? runwayRvr : vis;

            // Visibility Alert Status (Red vs Amber)
            let visRed = false;
            let visAmber = false;
            if (currentApproach && effectiveVis !== null) {
                if (effectiveVis < currentApproach.minVis) {
                    visRed = true;
                } else if (effectiveVis <= currentApproach.minVis + 600 || effectiveVis <= currentApproach.minVis * 1.25) {
                    visAmber = true; // Close to minimum
                }
            }

            // Ceiling Alert Status (Red vs Amber)
            let ceilingRed = false;
            let ceilingAmber = false;
            if (currentApproach && ceiling !== null) {
                if (ceiling < currentApproach.minCeiling) {
                    ceilingRed = true;
                } else if (ceiling <= currentApproach.minCeiling + 200) {
                    ceilingAmber = true; // Close to minimum ceiling
                }
            }

            // Check overall status
            const hasRedAlert = (alertWindEnabled && windRed) || (alertVisCeilingEnabled && (visRed || ceilingRed));
            const hasAmberAlert = !hasRedAlert && ((alertWindEnabled && windAmber) || (alertVisCeilingEnabled && (visAmber || ceilingAmber)));
            const isStale = age !== null && age > 120;

            const cardBorderColor = hasRedAlert 
                ? 'border-red-500 shadow-lg shadow-red-950/40 ring-1 ring-red-500' 
                : hasAmberAlert 
                ? 'border-amber-500 shadow-md shadow-amber-950/30 ring-1 ring-amber-500' 
                : 'border-slate-800 hover:border-slate-700';

            return (
                <div className={`relative bg-slate-900/95 border-2 rounded-xl p-2.5 flex flex-col h-full overflow-hidden transition-all duration-200 ${cardBorderColor}`}>
                    {isStale && (
                        <div className="absolute inset-0 pointer-events-none opacity-5 z-0" style={{ backgroundImage: 'repeating-linear-gradient(45deg, #fff 0px, #fff 2px, transparent 2px, transparent 8px)'}} />
                    )}

                    {/* TOP HEADER */}
                    <div className="flex justify-between items-start mb-1 z-10 gap-1">
                        <div className="flex items-center gap-1.5">
                            <h2 className="text-base font-extrabold tracking-wider text-white leading-none">{airport.code}</h2>
                            <span className="text-[10px] text-slate-400 font-medium hidden sm:inline">{airport.name}</span>
                            <div className="flex items-center gap-0.5 text-[9px] text-slate-400 font-mono ml-1">
                                <Icons.Clock className={isStale ? "text-amber-400" : ""} />
                                <span className={isStale ? "text-amber-400 font-bold" : ""}>{age ?? "--"}m</span>
                            </div>
                        </div>

                        {/* BADGES & PHENOMENA */}
                        <div className="flex items-center gap-1 flex-wrap justify-end">
                            {hasRedAlert && (
                                <span className="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[8px] font-bold bg-red-600 text-white animate-pulse">
                                    <Icons.AlertTriangle className="w-3 h-3" />
                                    <span>LIMITE ATINGIDO</span>
                                </span>
                            )}
                            {hasAmberAlert && (
                                <span className="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[8px] font-bold bg-amber-500 text-slate-950">
                                    <Icons.AlertTriangle className="w-3 h-3" />
                                    <span>PERTO DO LIMITE</span>
                                </span>
                            )}
                            {lowVisPhenom && (
                                <div className="text-slate-400 p-0.5" title="Nevoeiro / Neblina (FG/BR/HZ)">
                                    <Icons.CloudFog />
                                </div>
                            )}
                            {rain && (
                                <div className="text-sky-400 p-0.5" title="Chuva (Pista Molhada)">
                                    <Icons.CloudRain />
                                </div>
                            )}
                        </div>
                    </div>

                    {/* MAIN CONTENT: Left (Wind & Minima) + Right (Runway Compass) */}
                    <div className="flex-1 grid grid-cols-[1fr_auto] gap-2 items-center z-10 min-h-0">
                        {/* LEFT COLUMN */}
                        <div className="flex flex-col justify-between h-full overflow-hidden pr-0.5 text-[10px]">
                            {/* Wind Rows */}
                            <div className="flex flex-col gap-0.5 pb-1 border-b border-slate-800">
                                {windRows.map((r, i) => (
                                    <div key={i} className={`flex justify-between items-center gap-1 font-mono leading-tight px-1 py-0.5 rounded ${
                                        r.isRed ? 'text-red-400 font-bold bg-red-950/60 border border-red-800/60' :
                                        r.isAmb ? 'text-amber-300 font-semibold bg-amber-950/40 border border-amber-800/40' :
                                        'text-slate-300'
                                    }`}>
                                        <span className="truncate">{r.text}</span>
                                        <span className="text-right whitespace-nowrap opacity-80 font-sans text-[9px]">{r.limit}</span>
                                    </div>
                                ))}
                                {windRows.length === 0 && <div className="text-slate-500 italic">Sem vento disponível</div>}
                            </div>

                            {/* Approach Minima (Teto & VIS) */}
                            <div className="pt-1 flex flex-col gap-1">
                                <div className="flex items-center justify-between gap-1 text-[9px]">
                                    <div className="flex items-center gap-1">
                                        <span className="text-slate-400 font-bold uppercase text-[8px]">APCH RWY:</span>
                                        <div className="flex items-center gap-0.5">
                                            {approaches.map((ap) => {
                                                const isSelected = ap.rwy === activeRwyNum || (airport.code === "SJZ" && ((activeRwyNum === "13" && ap.rwy === "13") || (activeRwyNum === "31" && ap.rwy === "31")));
                                                const isFavoured = ap.rwy === naturalBestRwyNum || (airport.code === "SJZ" && ((naturalBestRwyNum === "13" && ap.rwy === "13") || (naturalBestRwyNum === "31" && ap.rwy === "31")));
                                                return (
                                                    <button
                                                        key={ap.rwy}
                                                        onClick={() => setManualRwy(ap.rwy)}
                                                        className={`px-1.5 py-0.5 rounded text-[9px] font-bold font-mono transition-colors cursor-pointer ${
                                                            isSelected 
                                                                ? 'bg-blue-600 text-white shadow-xs' 
                                                                : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'
                                                        }`}
                                                    >
                                                        {ap.rwy}{isFavoured ? '★' : ''}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <span className="font-mono text-slate-400 font-semibold text-[8px] truncate max-w-[100px]" title={currentApproach?.apch}>
                                        {currentApproach?.apch}
                                    </span>
                                </div>

                                {/* Comparison Grid */}
                                <div className="grid grid-cols-2 gap-1 text-[9px] font-mono">
                                    {/* VIS */}
                                    <div className={`p-1 rounded flex flex-col border ${
                                        visRed ? 'bg-red-950/70 border-red-700 text-red-300 font-bold ring-1 ring-red-600' :
                                        visAmber ? 'bg-amber-950/60 border-amber-600 text-amber-200 font-semibold' :
                                        'bg-slate-800/60 border-slate-700 text-slate-300'
                                    }`}>
                                        <div className="flex items-center justify-between text-[8px] uppercase tracking-wider opacity-75">
                                            <span>VIS / RVR</span>
                                            <span>MÍN {currentApproach?.minVis}m</span>
                                        </div>
                                        <div className="flex items-center justify-between mt-0.5">
                                            <span className="font-bold text-[10px] truncate">
                                                {runwayRvr !== null ? `RVR ${runwayRvr}m` : (vis !== null ? (vis >= 9999 ? '≥10 km' : `${vis}m`) : '--')}
                                            </span>
                                            {visRed ? (
                                                <span className="text-red-400 font-bold text-[8px]">⚠️ &lt; MÍN</span>
                                            ) : visAmber ? (
                                                <span className="text-amber-400 font-bold text-[8px]">⚠️ PRÓX</span>
                                            ) : (
                                                <span className="text-emerald-400 text-[8px] font-sans font-bold">✓ OK</span>
                                            )}
                                        </div>
                                    </div>

                                    {/* TETO */}
                                    <div className={`p-1 rounded flex flex-col border ${
                                        ceilingRed ? 'bg-red-950/70 border-red-700 text-red-300 font-bold ring-1 ring-red-600' :
                                        ceilingAmber ? 'bg-amber-950/60 border-amber-600 text-amber-200 font-semibold' :
                                        'bg-slate-800/60 border-slate-700 text-slate-300'
                                    }`}>
                                        <div className="flex items-center justify-between text-[8px] uppercase tracking-wider opacity-75">
                                            <span>TETO BKN</span>
                                            <span>MÍN {currentApproach?.minCeiling}'</span>
                                        </div>
                                        <div className="flex items-center justify-between mt-0.5">
                                            <span className="font-bold text-[10px] truncate" title={rawCeilingText}>
                                                {ceiling !== null ? `${ceiling} ft` : (isCavok ? 'CAVOK' : 'S/ Teto')}
                                            </span>
                                            {ceilingRed ? (
                                                <span className="text-red-400 font-bold text-[8px]">⚠️ &lt; MÍN</span>
                                            ) : ceilingAmber ? (
                                                <span className="text-amber-400 font-bold text-[8px]">⚠️ PRÓX</span>
                                            ) : (
                                                <span className="text-emerald-400 text-[8px] font-sans font-bold">✓ OK</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Runway Compass Visual */}
                        <div className="w-32 h-32 flex-shrink-0 flex items-center justify-center">
                            <RunwayVisual 
                                runwayHeading={airport.rwy} 
                                bestRunway={bestHdg} 
                                selectedRunwayHdg={manualRwy ? (parseInt(manualRwy, 10) * 10) : null}
                                arrowDir={arrow?.dir ?? null} 
                                arcStartAngle={arcFrom} 
                                arcEndAngle={arcTo} 
                            />
                        </div>
                    </div>

                    {/* BOTTOM: Raw METAR Text */}
                    <div className="mt-1 pt-1 border-t border-slate-800/80 z-10 flex items-center justify-between gap-2">
                        <p className="font-mono text-[9px] text-slate-400 leading-tight truncate flex-1" title={metar}>
                            {metar}
                        </p>
                    </div>
                </div>
            );
        };

        // --- AZORES AIRPORTS INTER-ISLAND DISTANCES (NM) ---
        const AZORES_DISTANCES = {
            PDL: { SMA: 53, TER: 89, SJZ: 122, PIX: 138, HOR: 147, GRW: 128, FLW: 278, CVU: 277 },
            SMA: { PDL: 53, TER: 141, SJZ: 174, PIX: 191, HOR: 200, GRW: 181, FLW: 331, CVU: 330 },
            TER: { GRW: 46, SJZ: 47, PIX: 68, HOR: 76, PDL: 89, SMA: 141, FLW: 190, CVU: 188 },
            GRW: { TER: 46, SJZ: 31, PIX: 49, HOR: 55, PDL: 128, SMA: 181, FLW: 153, CVU: 150 },
            SJZ: { PIX: 22, HOR: 35, GRW: 31, TER: 47, PDL: 122, SMA: 174, FLW: 151, CVU: 148 },
            PIX: { HOR: 15, SJZ: 22, TER: 68, GRW: 49, PDL: 138, SMA: 191, FLW: 142, CVU: 140 },
            HOR: { PIX: 15, SJZ: 35, TER: 76, GRW: 55, PDL: 147, SMA: 200, FLW: 131, CVU: 129 },
            FLW: { CVU: 14, HOR: 131, PIX: 142, SJZ: 151, GRW: 153, TER: 190, PDL: 278, SMA: 331 },
            CVU: { FLW: 14, HOR: 129, PIX: 140, SJZ: 148, GRW: 150, TER: 188, PDL: 277, SMA: 330 }
        };

        // --- COMPONENT: MAIN DASHBOARD VIEW WITH NOTIFICATION SYSTEM ---
        const DashboardOverview = ({ airports, allMetarData, windLimitsData, approachLimitsData, alertWindEnabled, alertVisCeilingEnabled, onNavigateLive, lastUpdated, nextUpdateSeconds }) => {
            // Compute status for all 9 airports
            const airportStatusList = useMemo(() => {
                return airports.map(airport => {
                    const mInfo = allMetarData[airport.icao] || {};
                    const metar = mInfo.metar;
                    const rain = metar ? hasRain(metar) : false;
                    const gen = metar ? parseGeneralWind(metar) : null;
                    const rwyWinds = metar ? parseRunwayWinds(metar) : [];

                    let windRed = false;
                    let windAmb = false;
                    let maxWindSpd = 0;
                    let matchedLimit = null;

                    // Check gen wind
                    if (gen && gen.type === "FIXED" && gen.dir !== undefined) {
                        const chk = gen.gust ?? gen.spd;
                        maxWindSpd = chk;
                        const data = windLimitsData[airport.code]?.[nearest10(gen.dir)];
                        if (data) {
                            const lim = rain && data.wet !== undefined ? data.wet : data.dry;
                            matchedLimit = lim;
                            if (lim !== undefined) {
                                if (chk > lim) windRed = true;
                                else if (chk >= lim - 4) windAmb = true;
                            }
                        }
                    }

                    // Check rwy winds
                    for (const w of rwyWinds) {
                        const chk = w.gust ?? w.spd;
                        if (chk > maxWindSpd) maxWindSpd = chk;
                        const data = w.dir !== undefined ? windLimitsData[airport.code]?.[nearest10(w.dir)] : null;
                        if (data) {
                            const lim = rain && data.wet !== undefined ? data.wet : data.dry;
                            if (lim !== undefined) {
                                if (chk > lim) windRed = true;
                                else if (chk >= lim - 4) windAmb = true;
                            }
                        }
                    }

                    // Vis & Ceiling
                    const { vis, ceiling, rvrMap, isCavok } = parseVisAndCeiling(metar);
                    const approaches = approachLimitsData[airport.code] || [];
                    
                    // Choose first approach / default
                    const apch = approaches[0];
                    const rvrVal = apch && rvrMap[apch.rwy] !== undefined ? rvrMap[apch.rwy] : null;
                    const effVis = rvrVal !== null ? rvrVal : vis;

                    let visRed = false;
                    let visAmb = false;
                    if (apch && effVis !== null) {
                        if (effVis < apch.minVis) visRed = true;
                        else if (effVis <= apch.minVis + 600 || effVis <= apch.minVis * 1.25) visAmb = true;
                    }

                    let ceilRed = false;
                    let ceilAmb = false;
                    if (apch && ceiling !== null) {
                        if (ceiling < apch.minCeiling) ceilRed = true;
                        else if (ceiling <= apch.minCeiling + 200) ceilAmb = true;
                    }

                    const isRed = (alertWindEnabled && windRed) || (alertVisCeilingEnabled && (visRed || ceilRed));
                    const isAmber = !isRed && ((alertWindEnabled && windAmb) || (alertVisCeilingEnabled && (visAmb || ceilAmb)));

                    return {
                        airport,
                        metar,
                        age: metar ? metarAgeMinutes(metar) : null,
                        isRed,
                        isAmber,
                        isNormal: !isRed && !isAmber && !mInfo.error,
                        error: mInfo.error,
                        windRed,
                        windAmb,
                        visRed,
                        visAmb,
                        ceilRed,
                        ceilAmb,
                        maxWindSpd,
                        matchedLimit,
                        effVis,
                        ceiling,
                        isCavok,
                        apch
                    };
                });
            }, [airports, allMetarData, windLimitsData, approachLimitsData, alertWindEnabled, alertVisCeilingEnabled]);

            // Filter active alert notifications with rich flight operations details
            const activeAlerts = useMemo(() => {
                const list = [];
                airportStatusList.forEach(item => {
                    const { airport, metar, windRed, windAmb, visRed, visAmb, ceilRed, ceilAmb, maxWindSpd, matchedLimit, effVis, ceiling, apch } = item;
                    const rwyStr = apch ? `RWY ${apch.rwy}` : (airport.runways?.[0]?.ident ? `RWY ${airport.runways[0].ident}` : '');

                    if (alertVisCeilingEnabled && apch) {
                        if (visRed) {

                                        <p className="text-xs text-slate-400 max-w-sm mt-1">Todos os 9 aeroportos dos Açores encontram-se dentro dos parâmetros regulamentares de vento, visibilidade e teto.</p>
                                    </div>

        // --- COMPONENT: ADMIN BACKEND LIMITS CONFIGURATION (PASSWORD PROTECTED: 1580) ---
        const AdminLimitsConfig = ({ windLimitsData, approachLimitsData, onSaveWindLimits, onSaveApproachLimits, onResetDefaults }) => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [errorMsg, setErrorMsg] = useState("");
            const [activeTab, setActiveTab] = useState("approach"); // "approach" | "wind"
            const [selectedAirport, setSelectedAirport] = useState("PDL");
            
            // Editable local copies
            const [localApproach, setLocalApproach] = useState(() => JSON.parse(JSON.stringify(approachLimitsData)));
            const [localWind, setLocalWind] = useState(() => JSON.parse(JSON.stringify(windLimitsData)));
            const [saveNotification, setSaveNotification] = useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === "1580") {
                    setIsAuthenticated(true);
                    setErrorMsg("");
                } else {
                    setErrorMsg("Palavra-passe incorreta. Acesso reservado a pessoal autorizado.");
                }
            };

            const handleSave = () => {
                onSaveWindLimits(localWind);
                onSaveApproachLimits(localApproach);
                setSaveNotification(true);
                setTimeout(() => setSaveNotification(false), 3000);
            };

            const handleApproachChange = (rwyIdx, field, val) => {
                setLocalApproach(prev => {
                    const copy = JSON.parse(JSON.stringify(prev));
                    if (copy[selectedAirport] && copy[selectedAirport][rwyIdx]) {
                        copy[selectedAirport][rwyIdx][field] = field === 'minVis' || field === 'minCeiling' ? parseInt(val, 10) || 0 : val;
                    }
                    return copy;
                });
            };

            const handleWindChange = (headingDeg, field, val) => {
                setLocalWind(prev => {
                    const copy = JSON.parse(JSON.stringify(prev));
                    if (!copy[selectedAirport]) copy[selectedAirport] = {};
                    if (!copy[selectedAirport][headingDeg]) copy[selectedAirport][headingDeg] = {};
                    if (val === "" || isNaN(val)) {
                        delete copy[selectedAirport][headingDeg][field];
                    } else {
                        copy[selectedAirport][headingDeg][field] = parseInt(val, 10);
                    }
                    return copy;
                });
            };

            if (!isAuthenticated) {
                return (
                    <div className="flex-1 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
                            <div className="w-14 h-14 rounded-2xl bg-blue-600/20 text-blue-400 mx-auto flex items-center justify-center mb-4">
                                <Icons.Lock />
                            </div>
                            <h2 className="text-xl font-bold text-white">Configuração de Limites</h2>
                            <p className="text-xs text-slate-400 mt-1 mb-6">
                                Introduza a palavra-passe de administrador para ajustar os limites de vento, visibilidade e teto dos aeroportos.
                            </p>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input 
                                        type="password" 
                                        value={passwordInput} 
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        placeholder="Palavra-passe (Dica: 1580)" 
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg font-mono tracking-widest text-white focus:outline-none focus:border-blue-500"

        // --- COMPONENT: CALCULADORA DE SOMA E SUBTRAÇÃO DE HORAS & MINUTOS (OCC) ---
        const HoursCalculator = () => {
            const [entries, setEntries] = useState([
                { id: 1, sign: '+', hours: '01', minutes: '30' },
                { id: 2, sign: '+', hours: '00', minutes: '45' },
                { id: 3, sign: '+', hours: '', minutes: '' }
            ]);

            const updateEntry = (id, field, value) => {
                setEntries(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const toggleSign = (id) => {
                setEntries(prev => prev.map(item => item.id === id ? { ...item, sign: item.sign === '+' ? '-' : '+' } : item));
            };

            const removeEntry = (id) => {
                if (entries.length <= 1) {
                    setEntries([{ id: 1, sign: '+', hours: '', minutes: '' }]);
                    return;
                }
                setEntries(prev => prev.filter(item => item.id !== id));
            };

            const addEntry = () => {
                const newId = entries.length > 0 ? Math.max(...entries.map(i => i.id)) + 1 : 1;
                setEntries(prev => [...prev, { id: newId, sign: '+', hours: '', minutes: '' }]);
                return newId;
            };

            // Keyboard Auto-Advance Handler
            const advanceToRow = (targetIndex) => {
                setTimeout(() => {
                    if (targetIndex < entries.length) {
                        const nextHourEl = document.getElementById(`calc-h-${targetIndex}`);
                        if (nextHourEl) {
                            nextHourEl.focus();
                            nextHourEl.select();
                        }
                    } else {
                        // At the end: append a new row and focus its hours field
                        const newId = entries.length > 0 ? Math.max(...entries.map(i => i.id)) + 1 : 1;
                        setEntries(prev => [...prev, { id: newId, sign: '+', hours: '', minutes: '' }]);
                        setTimeout(() => {
                            const newHourEl = document.getElementById(`calc-h-${targetIndex}`);
                            if (newHourEl) {
                                newHourEl.focus();
                                newHourEl.select();
                            }
                        }, 40);
                    }
                }, 10);
            };

            const handleHoursChange = (id, index, rawVal) => {
                const val = rawVal.replace(/\D/g, '').slice(0, 3);
                updateEntry(id, 'hours', val);
                // When 2 digits are filled, automatically focus minutes
                if (val.length >= 2) {
                    setTimeout(() => {
                        const minEl = document.getElementById(`calc-m-${index}`);
                        if (minEl) {
                            minEl.focus();
                            minEl.select();
                        }
                    }, 10);
                }
            };

            const handleMinutesChange = (id, index, rawVal) => {
                const val = rawVal.replace(/\D/g, '').slice(0, 2);
                updateEntry(id, 'minutes', val);
                // When 2 digits are filled, automatically advance to next row's hours
                if (val.length >= 2) {
                    advanceToRow(index + 1);
                }
            };

            const handleHoursKeyDown = (e, index) => {
                if (e.key === 'Enter' || e.key === ':') {
                    e.preventDefault();
                    const minEl = document.getElementById(`calc-m-${index}`);
                    if (minEl) { minEl.focus(); minEl.select(); }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    advanceToRow(index + 1);
                } else if (e.key === 'ArrowUp' && index > 0) {
                    e.preventDefault();
                    document.getElementById(`calc-h-${index - 1}`)?.focus();
                }
            };

            const handleMinutesKeyDown = (e, index) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    advanceToRow(index + 1);
                } else if (e.key === 'Backspace' && (!entries[index]?.minutes || entries[index]?.minutes === '')) {
                    e.preventDefault();
                    document.getElementById(`calc-h-${index}`)?.focus();
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    advanceToRow(index + 1);
                } else if (e.key === 'ArrowUp' && index > 0) {
                    e.preventDefault();
                    document.getElementById(`calc-m-${index - 1}`)?.focus();
                }
            };

            const applyPreset = (id, index, addH, addM) => {
                const item = entries[index];
                if (!item) return;
                const curH = parseInt(item.hours, 10) || 0;
                const curM = parseInt(item.minutes, 10) || 0;
                let total = curH * 60 + curM + addH * 60 + addM;
                if (total < 0) total = 0;
                const newH = Math.floor(total / 60);
                const newM = total % 60;
                setEntries(prev => prev.map(it => it.id === id ? {
                    ...it,
                    hours: String(newH).padStart(2, '0'),
                    minutes: String(newM).padStart(2, '0')
                } : it));
            };

            const handleReset = () => {
                setEntries([
                    { id: 1, sign: '+', hours: '', minutes: '' },
                    { id: 2, sign: '+', hours: '', minutes: '' }
                ]);
                setTimeout(() => document.getElementById('calc-h-0')?.focus(), 20);
            };

            // Calculate Grand Total
            const { totalMinutes, isNegative, totalStr, decimalStr, formulaStr } = useMemo(() => {
                let sumMins = 0;
                const terms = [];

                entries.forEach(it => {
                    const hasVal = it.hours !== '' || it.minutes !== '';
                    if (!hasVal) return;
                    const h = parseInt(it.hours, 10) || 0;
                    const m = parseInt(it.minutes, 10) || 0;
                    const mins = h * 60 + m;
                    if (it.sign === '-') {
                        sumMins -= mins;
                        terms.push(`- ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                    } else {
                        sumMins += mins;
                        terms.push(`+ ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                    }
                });

                const isNeg = sumMins < 0;
                const absM = Math.abs(sumMins);
                const th = Math.floor(absM / 60);
                const tm = absM % 60;
                const tStr = `${isNeg ? '-' : ''}${String(th).padStart(2, '0')}:${String(tm).padStart(2, '0')}`;
                const decStr = `${(sumMins / 60).toFixed(2)} h`;

                return {
                    totalMinutes: sumMins,
                    isNegative: isNeg,
                    totalStr: terms.length > 0 ? tStr : "00:00",
                    decimalStr: terms.length > 0 ? decStr : "0.00 h",
                    formulaStr: terms.length > 0 ? terms.join(' ') : "Nenhum valor introduzido"
                };
            }, [entries]);

            return (
                <div className="flex-1 overflow-y-auto p-4 custom-scroll space-y-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-3xl mx-auto shadow-xl">
                        {/* Header with Title and Reset Button */}
                        <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-800/60">
                                    <Icons.Calculator />
                                </div>
                                <div>
                                    <h3 className="text-base font-bold text-white">Calculadora de Horas e Minutos (Soma e Subtração)</h3>
                                    <p className="text-xs text-slate-400">Preencha horas e minutos com o teclado: avança automaticamente para o campo abaixo.</p>
                                </div>
                            </div>
                            <button
                                onClick={handleReset}
                                className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-red-950/80 hover:text-red-300 hover:border-red-800 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all cursor-pointer shadow-sm"
                                title="Limpar todos os campos e reiniciar"
                            >
                                <Icons.RotateCcw />
                                <span>Reset / Limpar</span>
                            </button>
                        </div>

                        {/* RESULT BANNER */}
                        <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                            <div>
                                <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">
                                    Total Acumulado ({entries.filter(e => e.hours !== '' || e.minutes !== '').length} parcelas)
                                </span>
                                <div className="flex items-baseline gap-3">
                                    <span className={`text-4xl font-black font-mono tracking-tight ${isNegative ? 'text-rose-400' : 'text-emerald-400'}`}>
                                        {totalStr}
                                    </span>
                                    <span className="text-sm font-bold font-mono text-slate-400">
                                        ({decimalStr})
                                    </span>
                                    <span className="text-xs text-slate-500 font-mono hidden md:inline">
                                        [{Math.abs(totalMinutes)} minutos]
                                    </span>
                                </div>
                                <div className="text-[11px] font-mono text-slate-400 mt-1 truncate max-w-lg">
                                    Fórmula: <span className="text-slate-300">{formulaStr}</span> = <strong className="text-white">{totalStr}</strong>
                                </div>
                            </div>
                            <button
                                onClick={addEntry}
                                className="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition-colors cursor-pointer flex items-center gap-1.5 shadow-sm"
                            >
                                <span>+ Adicionar Campo</span>
                            </button>
                        </div>

                        {/* DYNAMIC LIST OF TIME BLOCKS */}
                        <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1 custom-scroll">
                            {entries.map((entry, index) => {
                                const isPositive = entry.sign === '+';
                                return (
                                    <div 
                                        key={entry.id} 
                                        className="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between gap-2.5 hover:border-slate-700 transition-colors"
                                    >
                                        <div className="flex items-center gap-2 flex-1">
                                            {/* Index number */}
                                            <span className="text-[11px] font-mono font-bold text-slate-500 w-5 text-center">
                                                #{index + 1}
                                            </span>

                                            {/* Sign Toggle Button (+ / -) */}
                                            <button
                                                type="button"
                                                onClick={() => toggleSign(entry.id)}
                                                className={`w-8 h-8 rounded-lg font-black font-mono text-base flex items-center justify-center transition-all cursor-pointer shadow-xs ${
                                                    isPositive 
                                                        ? 'bg-emerald-950 text-emerald-300 border border-emerald-700 hover:bg-emerald-900' 
                                                        : 'bg-rose-950 text-rose-300 border border-rose-700 hover:bg-rose-900'
                                                }`}
                                                title={`Clique para alternar para ${isPositive ? 'Subtrair (-)' : 'Somar (+)'}`}
                                            >
                                                {entry.sign}
                                            </button>

                                            {/* Hours & Minutes Inputs with Auto-Advance */}
                                            <div className="flex items-center gap-1.5 font-mono">
                                                <div className="relative">
                                                    <input
                                                        id={`calc-h-${index}`}
                                                        type="text"
                                                        inputMode="numeric"
                                                        maxLength={3}
                                                        value={entry.hours}
                                                        onChange={(e) => handleHoursChange(entry.id, index, e.target.value)}
                                                        onKeyDown={(e) => handleHoursKeyDown(e, index)}
                                                        placeholder="HH"
                                                        className="w-16 bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-center text-sm font-bold text-white focus:outline-none focus:border-blue-500"
                                                    />
                                                    <span className="absolute -bottom-3.5 left-1/2 -translate-x-1/2 text-[8px] text-slate-500 uppercase font-bold">Horas</span>
                                                </div>

                                                <span className="text-slate-400 font-bold text-lg pb-1">:</span>

                                                <div className="relative">
                                                    <input
                                                        id={`calc-m-${index}`}
                                                        type="text"
                                                        inputMode="numeric"
                                                        maxLength={2}
                                                        value={entry.minutes}
                                                        onChange={(e) => handleMinutesChange(entry.id, index, e.target.value)}
                                                        onKeyDown={(e) => handleMinutesKeyDown(e, index)}
                                                        placeholder="MM"
                                                        className="w-16 bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-center text-sm font-bold text-white focus:outline-none focus:border-blue-500"
                                                    />
                                                    <span className="absolute -bottom-3.5 left-1/2 -translate-x-1/2 text-[8px] text-slate-500 uppercase font-bold">Minutos</span>
                                                </div>
                                            </div>

                                            {/* Quick Preset Buttons */}
                                            <div className="hidden sm:flex items-center gap-1 ml-3">
                                                <button
                                                    type="button"
                                                    onClick={() => applyPreset(entry.id, index, 0, 15)}
                                                    className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono cursor-pointer"
                                                >
                                                    +15m
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => applyPreset(entry.id, index, 0, 30)}
                                                    className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono cursor-pointer"
                                                >
                                                    +30m
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => applyPreset(entry.id, index, 0, 45)}
                                                    className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono cursor-pointer"
                                                >
                                                    +45m
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => applyPreset(entry.id, index, 1, 0)}
                                                    className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono cursor-pointer"
                                                >
                                                    +1h
                                                </button>
                                            </div>
                                        </div>

                                        {/* Remove Row Button */}
                                        <button
                                            type="button"
                                            onClick={() => removeEntry(entry.id)}
                                            className="w-7 h-7 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-slate-800 flex items-center justify-center transition-colors cursor-pointer"
                                            title="Remover esta linha"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Helper Footnote */}
                        <div className="mt-4 pt-3 border-t border-slate-800 text-[11px] text-slate-400 flex items-center justify-between">
                            <span>💡 Dica: Digite 2 dígitos em Horas e Minutos para saltar automaticamente para a linha abaixo.</span>
                            <button
                                onClick={addEntry}
                                className="text-blue-400 hover:text-blue-300 font-bold cursor-pointer"
                            >
                                + Adicionar Outro Bloco
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENT: GESTÃO DE FROTA & ROTAÇÕES OCC (AZORES FLEET TRACKER) ---
        const FleetTrackerView = () => {
            const [filterFleet, setFilterFleet] = useState("all");
            const [filterStatus, setFilterStatus] = useState("all");

        // --- COMPONENT: CALCULADORA DE FUEL TANKERING & ALTERNAS (OCC FLIGHT DISPATCH) ---

            const altDistanceNm = 45;

            const finalReserveKg = acType === "ATR72" ? 450 : 1100;

            const burnPenaltyPercent = flightTimeHrs * 3.5;

            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        const WEEKDAYS_PT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

        // NOAA / NAV AIP Portugal standard solar calculation algorithm
        function calculateAIPSunTimes(lat, lon, year, monthIndex, day) {
            const dateObj = new Date(Date.UTC(year, monthIndex, day));
            const startOfYear = new Date(Date.UTC(year, 0, 1));
            const N = Math.floor((dateObj - startOfYear) / 86400000) + 1;
            const lngHour = lon / 15;

            const computeEvent = (isSunrise, zenithDeg) => {
                const t = isSunrise ? N + ((6 - lngHour) / 24) : N + ((18 - lngHour) / 24);
                const M = (0.9856 * t) - 3.289;
                const rad = Math.PI / 180;
                const deg = 180 / Math.PI;

                let L = M + (1.916 * Math.sin(M * rad)) + (0.020 * Math.sin(2 * M * rad)) + 282.634;
                L = (L % 360 + 360) % 360;

                let RA = deg * Math.atan(0.91764 * Math.tan(L * rad));
                RA = (RA % 360 + 360) % 360;

                const Lquadrant = Math.floor(L / 90) * 90;
                const RAquadrant = Math.floor(RA / 90) * 90;
                RA = RA + (Lquadrant - RAquadrant);
                RA = RA / 15;

                const sinDec = 0.39782 * Math.sin(L * rad);
                const cosDec = Math.cos(Math.asin(sinDec));

                const cosH = (Math.cos(zenithDeg * rad) - (sinDec * Math.sin(lat * rad))) / (cosDec * Math.cos(lat * rad));

                if (cosH > 1 || cosH < -1) return null;

                let H = isSunrise ? 360 - deg * Math.acos(cosH) : deg * Math.acos(cosH);
                H = H / 15;

                const T = H + RA - (0.06571 * t) - 6.622;
                let UT = T - lngHour;
                UT = (UT % 24 + 24) % 24;

                const totalMinutes = Math.round(UT * 60);
                const hh = Math.floor(totalMinutes / 60) % 24;
                const mm = totalMinutes % 60;
                return {
                    hours: hh,
                    minutes: mm,
                    totalMinutes: hh * 60 + mm,
                    utDecimal: UT,
                    utcStr: `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`,
                    localDate: new Date(Date.UTC(year, monthIndex, day, hh, mm))
                };
            };

            // NAV AIP official zeniths: 90°50' for SR/SS, 96°00' for Civil Twilight
            const twilMorn = computeEvent(true, 96.0);
            const sunrise = computeEvent(true, 90.8333);
            const sunset = computeEvent(false, 90.8333);
            const twilEve = computeEvent(false, 96.0);

            let daylightMins = 0;
            if (sunrise && sunset) {
                daylightMins = sunset.totalMinutes - sunrise.totalMinutes;
                if (daylightMins < 0) daylightMins += 1440;
            }
            const dayH = Math.floor(daylightMins / 60);
            const dayM = daylightMins % 60;

            let vfrMins = 0;
            if (twilMorn && twilEve) {
                vfrMins = twilEve.totalMinutes - twilMorn.totalMinutes;
                if (vfrMins < 0) vfrMins += 1440;
            }
            const vfrH = Math.floor(vfrMins / 60);
            const vfrM = vfrMins % 60;

            return {
                day,
                monthIndex,
                year,
                weekday: WEEKDAYS_PT[dateObj.getUTCDay()],
                dateStr: `${String(day).padStart(2, '0')}/${String(monthIndex + 1).padStart(2, '0')}`,
                twilMorn,
                sunrise,
                sunset,
                twilEve,
                daylightMins,
                daylightDuration: `${dayH}h ${String(dayM).padStart(2, '0')}m`,
                vfrDuration: `${vfrH}h ${String(vfrM).padStart(2, '0')}m`
            };
        }

        // --- COMPONENT: SUNSET, SUNRISE & CIVIL TWILIGHT (NAV AIP PORTUGAL GEN 2.7) ---

                const tm = todaySunData.twilMorn?.totalMinutes ?? 0;

                    const remainingSS = ss - nowUtcMinutes;

                    const rM = remainingSS % 60;

                        label: "CREPÚSCULO CIVIL VESPERTINO",
                        phase: "twilight_evening",

                                            Tabelas Oficiais de Nascer, Pôr do Sol & Crepúsculo Civil
                                        </h2>
                                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-blue-950 border border-blue-800 text-blue-300 font-bold">
                                            NAV AIP GEN 2.7
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-0.5">
                                        Valores astronómicos oficiais para os 9 aeródromos dos Açores (Secção GEN 2.7 AIP Portugal)
                                    </p>
                                </div>
                            </div>

                            {/* CURRENT DATE & MONTH HIGHLIGHT BANNER */}
                            <div className="mt-3 flex items-center gap-2 text-xs flex-wrap font-mono">
                                <span className="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-black flex items-center gap-1.5 shadow-xs">
                                    <span>★ HOJE:</span>
                                    <span>{currentDay} de {MONTHS_PT[currentMonth]} de {currentYear}</span>

                        {/* CONTROLS & JUMP TO TODAY */}
                        <div className="flex items-center gap-2 flex-wrap flex-shrink-0">

        // --- COMPONENT: ECRÃ GRANDE GABINETE OCC (WALLBOARD FULLSCREEN SEM MENU) ---
        const TVWallboardView = ({ airports, allMetarData, windLimitsData, approachLimitsData, alertWindEnabled, alertVisCeilingEnabled, onExit, lastUpdated, nextUpdateSeconds, onRefreshMetar }) => {
            const [timeStr, setTimeStr] = useState({ zulu: "", azores: "", fullClock: "" });
            const [audioEnabled, setAudioEnabled] = useState(false);

            // Clock update loop
            useEffect(() => {
                const updateClocks = () => {
                    const now = new Date();
                    
                    // Horas Zulu (UTC)
                    const zH = String(now.getUTCHours()).padStart(2, '0');
                    const zM = String(now.getUTCMinutes()).padStart(2, '0');
                    const zS = String(now.getUTCSeconds()).padStart(2, '0');
                    const zuluFormatted = `${zH}:${zM}:${zS}`;

                    // Hora oficial legal dos Açores (via fuso horário Atlantic/Azores)
                    const azoresTime = now.toLocaleTimeString('pt-PT', { 
                        timeZone: 'Atlantic/Azores', 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        second: '2-digit',
                        hour12: false 
                    });

                    // Se a hora UTC for igual à hora dos Açores (horário de verão)
                    const isSame = zuluFormatted === azoresTime;

                    setTimeStr({
                        zulu: `${zuluFormatted} Z`,
                        azores: azoresTime,
                        fullClock: isSame ? `${zuluFormatted} UTC / AÇORES` : `${zuluFormatted} Z (Açores: ${azoresTime})`,
                        isSame
                    });
                };

                updateClocks();
                const interval = setInterval(updateClocks, 1000);
                return () => clearInterval(interval);
            }, []);

            // 60s backup interval for wallboard
            useEffect(() => {
                const t = setInterval(() => {
                    if (onRefreshMetar) onRefreshMetar();
                }, 60000);
                return () => clearInterval(t);
            }, [onRefreshMetar]);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            };

            const airportStatusList = useMemo(() => {
                return airports.map(airport => {
                    const mInfo = allMetarData[airport.icao] || {};
                    const metar = mInfo.metar;
                    const rain = metar ? hasRain(metar) : false;
                    const gen = metar ? parseGeneralWind(metar) : null;
                    const rwyWinds = metar ? parseRunwayWinds(metar) : [];

                    let windRed = false;
                    let windAmb = false;
                    let maxWindSpd = 0;
                    let matchedLimit = null;

                    if (gen && gen.type === "FIXED" && gen.dir !== undefined) {
                        const chk = gen.gust ?? gen.spd;
                        maxWindSpd = chk;
                        const data = windLimitsData[airport.code]?.[nearest10(gen.dir)];
                        if (data) {
                            const lim = rain && data.wet !== undefined ? data.wet : data.dry;
                            matchedLimit = lim;
                            if (lim !== undefined) {
                                if (chk > lim) windRed = true;
                                else if (chk >= lim - 4) windAmb = true;
                            }
                        }
                    }

                    for (const w of rwyWinds) {
                        const chk = w.gust ?? w.spd;
                        if (chk > maxWindSpd) maxWindSpd = chk;
                        const data = w.dir !== undefined ? windLimitsData[airport.code]?.[nearest10(w.dir)] : null;
                        if (data) {
                            const lim = rain && data.wet !== undefined ? data.wet : data.dry;
                            if (lim !== undefined) {
                                if (chk > lim) windRed = true;
                                else if (chk >= lim - 4) windAmb = true;
                            }
                        }
                    }

                    const { vis, ceiling, rvrMap, isCavok } = parseVisAndCeiling(metar);
                    const approaches = approachLimitsData[airport.code] || [];
                    const apch = approaches[0];
                    const rvrVal = apch && rvrMap[apch.rwy] !== undefined ? rvrMap[apch.rwy] : null;
                    const effVis = rvrVal !== null ? rvrVal : vis;

                    let visRed = false;
                    let visAmb = false;
                    if (apch && effVis !== null) {
                        if (effVis < apch.minVis) visRed = true;
                        else if (effVis <= apch.minVis + 600 || effVis <= apch.minVis * 1.25) visAmb = true;
                    }

                    let ceilRed = false;
                    let ceilAmb = false;
                    if (apch && ceiling !== null) {
                        if (ceiling < apch.minCeiling) ceilRed = true;
                        else if (ceiling <= apch.minCeiling + 200) ceilAmb = true;
                    }

                    const isRed = (alertWindEnabled && windRed) || (alertVisCeilingEnabled && (visRed || ceilRed));
                    const isAmber = !isRed && ((alertWindEnabled && windAmb) || (alertVisCeilingEnabled && (visAmb || ceilAmb)));

                    return {
                        airport,
                        metar,
                        isRed,
                        isAmber,
                        isNormal: !isRed && !isAmber && !mInfo.error,
                        windRed,
                        windAmb,
                        visRed,
                        visAmb,
                        ceilRed,
                        ceilAmb,
                        maxWindSpd,
                        matchedLimit,
                        effVis,
                        ceiling,
                        isCavok,
                        apch
                    };
                });
            }, [airports, allMetarData, windLimitsData, approachLimitsData, alertWindEnabled, alertVisCeilingEnabled]);

            const redAlerts = airportStatusList.filter(a => a.isRed);
            const amberAlerts = airportStatusList.filter(a => a.isAmber);
            const activeAlerts = airportStatusList.filter(a => a.isRed || a.isAmber);

            return (
                <div className="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col overflow-hidden select-none p-4 md:p-6 space-y-4">
                    {/* TV WALLBOARD ULTRA-CLEAN HEADER */}
                    <header className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-2xl px-6 py-3 shadow-xl flex-shrink-0">

                            <div>
