        // --- UTILITY FUNCTIONS ---
        const fmtDir = (d) => String(d).padStart(3, "0");
        const nearest10 = (d) => Math.min(360, Math.max(10, Math.round(d / 10) * 10));

        function metarAgeMinutes(m) {
            if (!m) return null;
            const r = m.match(/\b(\d{2})(\d{2})(\d{2})Z\b/);
            if (!r) return null;
            const day = parseInt(r[1], 10);
            const hour = parseInt(r[2], 10);
            const min = parseInt(r[3], 10);
            const now = new Date();
            let year = now.getUTCFullYear();
            let month = now.getUTCMonth();
            
            // Month boundary handling: e.g. now is day 1-2, metar is day 28-31
            if (now.getUTCDate() < 5 && day > 25) {
                month -= 1;
                if (month < 0) { month = 11; year -= 1; }
            } else if (now.getUTCDate() > 25 && day < 5) {
                month += 1;
                if (month > 11) { month = 0; year += 1; }
            }
            
            const metarDate = new Date(Date.UTC(year, month, day, hour, min));
            const diffMs = now.getTime() - metarDate.getTime();
            let diffMins = Math.round(diffMs / 60000);
            if (diffMins < 0 && diffMins >= -10) diffMins = 0;
            return diffMins;
        }

        function isMetarValid(m) {
            if (!m) return false;
            const age = metarAgeMinutes(m);
            return age !== null && age <= 120;
        }

        function hasRain(metar) {
            if (!metar) return false;
            return /\b(-|\+)?(RA|DZ|DZRA|SHRA|VCSH|TSRA|VCTS|TS|RASN|SNRA|GS|GR|PL|UP)\b/i.test(metar) ||
                   /\b(WET|DAMP)\b/i.test(metar);
        }

        function isCvuWetRunway(metar) {
            if (!metar) return false;
            if (hasRain(metar)) return true;
            if (/\b(11|29)([12589])([1259\/])(?:(\d{2})|(\/\/))\b/.test(metar)) return true;
            if (/\bR(11|29)\/([0-9\/]{6}|WET|DAMP|WATER)/i.test(metar)) return true;
            if (/\b(WET\s+RWY|RWY\s+WET|WATER\s+PATCHES|STANDING\s+WATER|PISTA\s+MOLHADA|WET|DAMP)\b/i.test(metar)) return true;
            return false;
        }

        function parseGeneralWind(m) {
            const vrb = m.match(/VRB(\d{2})(?:G(\d{2}))?KT/);
            if (vrb) return { type: "VRB", spd: +vrb[1], gust: vrb[2] ? +vrb[2] : undefined };
            const fixed = m.match(/(\d{3})(\d{2})(?:G(\d{2}))?KT(?:\s+(\d{3})V(\d{3}))?/);
            if (fixed) return { type: "FIXED", dir: +fixed[1], spd: +fixed[2], gust: fixed[3] ? +fixed[3] : undefined, varFrom: fixed[4] ? +fixed[4] : undefined, varTo: fixed[5] ? +fixed[5] : undefined };
            return null;
        }

        function parseRunwayWinds(m) {
            const out = [];
            const re = /RWY(\d{2})\s+(?:(VRB)|(\d{3}))(\d{2})(?:G(\d{2}))?KT(?:\s+(\d{3})V(\d{3}))?/gi;
            let x;
            while ((x = re.exec(m))) {
                out.push({ rwy: x[1], type: x[2] ? "VRB" : "FIXED", dir: x[3] ? +x[3] : undefined, spd: +x[4], gust: x[5] ? +x[5] : undefined, varFrom: x[6] ? +x[6] : undefined, varTo: x[7] ? +x[7] : undefined });
            }
            return out;
        }

        function parseVisAndCeiling(metar) {
            let vis = null;
            let isCavok = false;
            let ceiling = null;
            let rvrMap = {};

            if (!metar) return { vis, isCavok, ceiling, rvrMap };

            if (/\bCAVOK\b/.test(metar)) {
                return { vis: 9999, isCavok: true, ceiling: null, rvrMap };
            }

            const rvrRegex = /\bR(\d{2}[LCR]?)\/([MP])?(\d{4})(?:V([MP])?(\d{4}))?[NUD]?\b/g;
            let rvrMatch;
            while ((rvrMatch = rvrRegex.exec(metar)) !== null) {
                const rwyNum = rvrMatch[1].replace(/[LCR]/, '');
                rvrMap[rwyNum] = parseInt(rvrMatch[3], 10);
            }

            const tokens = metar.split(/\s+/);
            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                const visMeterMatch = token.match(/^(\d{4})(?:NDV|[NSEW]{1,2})?$/);
                if (visMeterMatch) {
                    const parsedMeters = parseInt(visMeterMatch[1], 10);
                    if (!token.endsWith("Z") && !token.startsWith("Q") && !token.startsWith("RWY")) {
                        vis = parsedMeters;
                        break;
                    }
                }
                const smFractionMatch = token.match(/^(\d+)\/(\d+)SM$/);
                if (smFractionMatch) {
                    vis = Math.round((parseInt(smFractionMatch[1], 10) / parseInt(smFractionMatch[2], 10)) * 1609);
                    break;
                }
                const smWholeMatch = token.match(/^(\d+)SM$/);
                if (smWholeMatch) {
                    vis = Math.round(parseInt(smWholeMatch[1], 10) * 1609);
                    break;
                }
            }

            const vvMatch = metar.match(/\bVV(\d{3}|\/\/\/)\b/);
            if (vvMatch) {
                ceiling = vvMatch[1] === "///" ? 0 : parseInt(vvMatch[1], 10) * 100;
            }

            const cloudRegex = /\b(BKN|OVC)(\d{3})(?:CB|TCU)?\b/g;
            let cMatch;
            while ((cMatch = cloudRegex.exec(metar)) !== null) {
                const heightFt = parseInt(cMatch[2], 10) * 100;
                if (ceiling === null || heightFt < ceiling) {
                    ceiling = heightFt;
                }
            }

            return { vis, isCavok, ceiling, rvrMap };
        }

        // --- MAIN STANDALONE WALLBOARD APPLICATION ---
        const StandaloneWallboardApp = () => {
            const [windLimitsData] = useState(() => {
                const saved = localStorage.getItem("raa_wind_limits");
                return saved ? JSON.parse(saved) : defaultWindLimits;
            });

            const [approachLimitsData] = useState(() => {
                const saved = localStorage.getItem("raa_apch_limits");
                return saved ? JSON.parse(saved) : defaultApproachLimits;
            });

            // Master METARs state (polling all 9 airports every 60s)
            const [allMetarData, setAllMetarData] = useState({});
            const [refreshCounter, setRefreshCounter] = useState(0);
            const [secondsToNextRefresh, setSecondsToNextRefresh] = useState(60);

            // UTC Clock only
            const [utcClock, setUtcClock] = useState(() => {
                const now = new Date();
                const h = String(now.getUTCHours()).padStart(2, '0');
                const m = String(now.getUTCMinutes()).padStart(2, '0');
                const s = String(now.getUTCSeconds()).padStart(2, '0');
                return `${h}:${m}:${s} UTC`;
            });

            useEffect(() => {
                const clockTimer = setInterval(() => {
                    const now = new Date();
                    const h = String(now.getUTCHours()).padStart(2, '0');
                    const m = String(now.getUTCMinutes()).padStart(2, '0');
                    const s = String(now.getUTCSeconds()).padStart(2, '0');
                    setUtcClock(`${h}:${m}:${s} UTC`);
                }, 1000);
                return () => clearInterval(clockTimer);
            }, []);

            // 1-second countdown ticker for 60s auto-refresh
            useEffect(() => {
                const ticker = setInterval(() => {
                    setSecondsToNextRefresh(prev => (prev <= 1 ? 60 : prev - 1));
                }, 1000);
                return () => clearInterval(ticker);
            }, []);

            // Polling loop every 60 seconds
            useEffect(() => {
                let mounted = true;
                const fetchAll = async () => {
                    const next = {};
                    await Promise.all(
                        initialAirports.map(async (ap) => {
                            try {
                                const res = await fetch(`https://metar.vatsim.net/${ap.icao}?t=${Date.now()}`);
                                const text = await res.text();
                                if (!text || text.trim().length < 10) throw new Error("Empty");
                                next[ap.icao] = { metar: text.trim(), error: false };
                            } catch (e) {
                                next[ap.icao] = { metar: allMetarData[ap.icao]?.metar || null, error: true };
                            }
                        })
                    );
                    if (mounted) {
                        setAllMetarData(prev => ({ ...prev, ...next }));
                        setSecondsToNextRefresh(60);
                    }
                };

                fetchAll();
                const timer = setInterval(fetchAll, 60000);
                return () => { mounted = false; clearInterval(timer); };
            }, [refreshCounter]);

            // Compute status for all 9 airports
            const airportStatusList = useMemo(() => {
                return initialAirports.map(airport => {
                    const mInfo = allMetarData[airport.icao] || {};
                    const metar = mInfo.metar;
                    const rain = metar ? hasRain(metar) : false;
                    const gen = metar ? parseGeneralWind(metar) : null;
                    const rwyWinds = metar ? parseRunwayWinds(metar) : [];

                    let windRed = false;
                    let windAmb = false;
                    let maxWindSpd = 0;
                    let matchedLimit = null;

                    if (gen && gen.type === "FIXED" && gen.dir !== undefined) {
                        const chk = gen.gust ?? gen.spd;
                        maxWindSpd = chk;
                        const data = windLimitsData[airport.code]?.[nearest10(gen.dir)];
                        if (data) {
                            const lim = rain && data.wet !== undefined ? data.wet : data.dry;
                            matchedLimit = lim;
                            if (lim !== undefined) {
                                if (chk > lim) windRed = true;
                                else if (chk >= lim - 4) windAmb = true;
                            }
                        }
                    }

                    for (const w of rwyWinds) {
                        const chk = w.gust ?? w.spd;
                        if (chk > maxWindSpd) maxWindSpd = chk;
                        const data = w.dir !== undefined ? windLimitsData[airport.code]?.[nearest10(w.dir)] : null;
                        if (data) {
                            const lim = rain && data.wet !== undefined ? data.wet : data.dry;
                            if (lim !== undefined) {
                                if (chk > lim) windRed = true;
                                else if (chk >= lim - 4) windAmb = true;
                            }
                        }
                    }

                    const { vis, ceiling, rvrMap, isCavok } = parseVisAndCeiling(metar);
                    const approaches = approachLimitsData[airport.code] || [];
                    const apch = approaches[0];
                    const rvrVal = apch && rvrMap[apch.rwy] !== undefined ? rvrMap[apch.rwy] : null;
                    const effVis = rvrVal !== null ? rvrVal : vis;

                    let visRed = false;
                    let visAmb = false;
                    if (apch && effVis !== null) {
                        if (effVis < apch.minVis) visRed = true;
                        else if (effVis <= apch.minVis + 600 || effVis <= apch.minVis * 1.25) visAmb = true;
                    }

                    let ceilRed = false;
                    let ceilAmb = false;
                    if (apch && ceiling !== null) {
                        if (ceiling < apch.minCeiling) ceilRed = true;
                        else if (ceiling <= apch.minCeiling + 200) ceilAmb = true;
                    }

                    // CVU Wet Runway Condition Check
                    const cvuWet = airport.code === "CVU" && isCvuWetRunway(metar);

                    const age = metar ? metarAgeMinutes(metar) : null;
                    const isStale = age !== null && age > 120;

                    // If METAR >120m, simply do not report any alerts
                    let isRed = false;
                    let isAmber = false;
                    if (!isStale) {
                        isRed = windRed || visRed || ceilRed;
                        isAmber = !isRed && (windAmb || visAmb || ceilAmb || cvuWet);
                    }

                    return {
                        airport,
                        metar,
                        age,
                        isStale,
                        isRed,
                        isAmber,
                        windRed,
                        windAmb,
                        visRed,
                        visAmb,
                        ceilRed,
                        ceilAmb,
                        maxWindSpd,
                        matchedLimit,
                        effVis,
                        ceiling,
                        isCavok,
                        apch,
                        cvuWet
                    };
                });
            }, [allMetarData, windLimitsData, approachLimitsData]);

            const redAlerts = airportStatusList.filter(a => a.isRed);
            const amberAlerts = airportStatusList.filter(a => a.isAmber);
            const activeAlerts = airportStatusList.filter(a => a.isRed || a.isAmber);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            };

            return (
                <div className="h-screen w-screen bg-slate-100 text-slate-900 flex flex-col overflow-hidden p-4 md:p-6 space-y-4">
                    {/* TV WALLBOARD LIGHT HEADER */}
                    <header className="flex items-center justify-between bg-white border border-slate-200 rounded-2xl px-6 py-3.5 shadow-sm flex-shrink-0">
                        {/* OCC Branding */}
                        <div className="flex items-center gap-3.5">
                            <div className="p-2.5 rounded-xl bg-blue-600 text-white font-black shadow-sm flex items-center justify-center">
                                <Icons.Tv />
                            </div>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="text-base font-black tracking-tight text-slate-900 uppercase">
                                        OCC SATA
                                    </h1>
                                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-blue-50 border border-blue-200 text-blue-700 font-bold">
                                        LIVE
                                    </span>
                                </div>
                                <p className="text-[11px] text-slate-500 font-mono">Painel de alertas operacionais RAA para frota DH8</p>
                            </div>
                        </div>

                        {/* Centered Large High-Contrast Clock: ONLY UTC */}
                        <div className="flex items-center gap-3">
                            <div className="bg-slate-50 px-5 py-2 rounded-xl border border-slate-300 font-mono shadow-xs flex items-center gap-2.5">
                                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                <span className="text-xl md:text-2xl font-black text-slate-900 tracking-wider">
                                    {utcClock}
                                </span>
                            </div>
                            <div className="hidden lg:flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-[11px] text-emerald-700 font-bold" title="Atualização automática a cada 60s">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span>ATUALIZA EM {secondsToNextRefresh}s</span>
                            </div>
                        </div>

                        {/* Actions (Fullscreen and Refresh) */}
                        <div className="flex items-center gap-2.5">
                            <button
                                onClick={() => setRefreshCounter(c => c + 1)}
                                className="p-2.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-300 cursor-pointer shadow-xs transition-colors"
                                title="Atualizar dados agora"
                            >
                                <Icons.Refresh />
                            </button>
                            <button
                                onClick={toggleFullscreen}
                                className="p-2.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-300 cursor-pointer shadow-xs transition-colors"
                                title="Ecrã Inteiro (F11)"
                            >
                                <Icons.Maximize />
                            </button>
                        </div>
                    </header>

                    {/* MAIN DISPLAY: ZERO NOISE & NO ALTERNATES */}
                    {activeAlerts.length === 0 ? (
                        /* STATE 1: NADA A REPORTAR (TODOS OS 9 AERÓDROMOS DENTRO DOS LIMITES) */
                        <div className="flex-1 flex flex-col items-center justify-center bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-md relative overflow-hidden">
                            <div className="absolute inset-0 bg-emerald-500/5 pointer-events-none"></div>

                            <div className="relative z-10 flex flex-col items-center max-w-xl mx-auto space-y-6">
                                {/* Big Green Status Circle */}
                                <div className="w-24 h-24 rounded-full bg-emerald-50 border-2 border-emerald-500 flex items-center justify-center text-emerald-600 shadow-lg shadow-emerald-500/10">
                                    <Icons.CheckCircle />
                                </div>

                                <div className="space-y-2">
                                    <h2 className="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight">
                                        NADA A REPORTAR
                                    </h2>
                                    <p className="text-base sm:text-lg text-emerald-700 font-bold">
                                        Todos os 9 aeródromos dentro dos limites.
                                    </p>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* STATE 2: ALERTA ATIVO - DIVIDIDO EM 3 COLUNAS */
                        <div className="flex-1 flex flex-col min-h-0 space-y-3.5">
                            {/* Summary Bar - ONLY ALERTA OPERACIONAL HAS PULSE */}
                            <div className={`p-4 rounded-2xl border-2 flex items-center justify-between flex-shrink-0 shadow-sm ${
                                redAlerts.length > 0 
                                    ? 'bg-red-50 border-red-500 text-red-950 animate-pulse' 
                                    : 'bg-amber-50 border-amber-500 text-amber-950'
                            }`}>
                                <div className="flex items-center gap-3">
                                    <span className="text-2xl font-black font-mono">
                                        {redAlerts.length > 0 ? "⚠️" : "⚡"}
                                    </span>
                                    <div>
                                        <h2 className="text-base sm:text-lg font-black tracking-wide uppercase">
                                            {redAlerts.length > 0 
                                                ? `ALERTA OPERACIONAL: ${redAlerts.length} AERÓDROMO(S) FORA DOS LIMITES` 
                                                : `AVISO OPERACIONAL: ${amberAlerts.length} AERÓDROMO(S) PRÓXIMO DOS LIMITES`}
                                        </h2>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 font-mono">
                                    {activeAlerts.map(a => (
                                        <strong 
                                            key={a.airport.code} 
                                            className={`px-3 py-1.5 rounded-xl text-sm font-black border shadow-xs ${
                                                a.isRed 
                                                    ? 'bg-red-600 text-white border-red-700' 
                                                    : 'bg-amber-500 text-slate-950 border-amber-600'
                                            }`}
                                        >
                                            {a.airport.code}
                                        </strong>
                                    ))}
                                </div>
                            </div>

                            {/* 3-Column Wallboard Layout - Compact vertical cards, left-to-right row-major flow */}
                            <div className="flex-1 min-h-0 w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 overflow-y-auto custom-scroll content-start">
                                {activeAlerts.map(item => {
                                    const { airport, isRed, isAmber, maxWindSpd, matchedLimit, effVis, ceiling, isCavok, apch, metar, cvuWet } = item;
                                    const rwyNumber = apch?.rwy ?? '--';

                                    return (
                                        <div
                                            key={airport.code}
                                            className={`rounded-2xl border-2 p-3.5 sm:p-4 flex flex-col justify-between shadow-sm transition-all bg-white ${
                                                isRed 
                                                    ? 'border-red-500 ring-1 ring-red-500/20 shadow-red-100' 
                                                    : 'border-amber-500 ring-1 ring-amber-500/20 shadow-amber-100'
                                            }`}
                                        >
                                            <div>
                                                {/* Header: IATA code + Airport Name & Status Badge (no pulse) */}
                                                <div className="flex items-center justify-between pb-2.5 border-b border-slate-200">
                                                    <div className="flex items-center gap-3">
                                                        <span className="w-11 h-11 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center font-mono font-black text-xl text-white shadow-xs">
                                                            {airport.code}
                                                        </span>
                                                        <div>
                                                            <div className="flex items-baseline gap-1.5">
                                                                <h3 className="text-base font-black text-slate-900 tracking-tight">
                                                                    {airport.name}
                                                                </h3>
                                                            </div>
                                                            <span className="text-[11px] font-mono text-slate-500">
                                                                {airport.icao} • RWY {rwyNumber}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    <span className={`px-2.5 py-1 rounded-lg font-mono font-black text-[10px] uppercase tracking-wider ${
                                                        isRed ? 'bg-red-600 text-white' : (airport.code === 'CVU' && cvuWet ? 'bg-amber-500 text-slate-950' : 'bg-amber-500 text-slate-950')
                                                    }`}>
                                                        {isRed ? '(FORA LIMITES)' : (airport.code === 'CVU' && cvuWet ? '(PISTA MOLHADA)' : '(AVISO)')}
                                                    </span>
                                                </div>

                                                {/* CVU Wet Runway Notice (Compact, no pulse) */}
                                                {airport.code === "CVU" && cvuWet && (
                                                    <div className="mt-2.5 px-2.5 py-1.5 rounded-lg bg-amber-50 border border-amber-300 text-amber-950 text-xs font-mono flex items-center justify-between">
                                                        <span className="font-bold flex items-center gap-1.5 text-[11px]">
                                                            <span>⚠️</span>
                                                            <span>CVU: PISTA 11/29 MOLHADA</span>
                                                        </span>
                                                        <span className="text-[9px] font-bold text-amber-800 font-sans uppercase">Limitação Crítica</span>
                                                    </div>
                                                )}

                                                {/* 3 Main Parameter Indicators: Wind, Vis, Ceiling (Compact) */}
                                                <div className="grid grid-cols-3 gap-2 my-2.5 font-mono text-center">
                                                    {/* VENTO */}
                                                    <div className={`p-2 rounded-lg border flex flex-col justify-between ${
                                                        item.windRed ? 'bg-red-50 border-red-300 text-red-900' :
                                                        item.windAmb ? 'bg-amber-50 border-amber-300 text-amber-900' :
                                                        'bg-slate-50 border-slate-200 text-slate-700'
                                                    }`}>
                                                        <span className="text-[9px] uppercase font-bold text-slate-500 block">
                                                            Vento Máx
                                                        </span>
                                                        <span className="text-xl font-black block my-0.5">
                                                            {maxWindSpd > 0 ? `${maxWindSpd}kt` : '--'}
                                                        </span>
                                                        <span className="text-[9px] text-slate-500 block truncate">
                                                            Lim: <strong className="text-slate-900">{matchedLimit ?? '--'}kt</strong>
                                                        </span>
                                                    </div>

                                                    {/* VISIBILIDADE */}
                                                    <div className={`p-2 rounded-lg border flex flex-col justify-between ${
                                                        item.visRed ? 'bg-red-50 border-red-300 text-red-900' :
                                                        item.visAmb ? 'bg-amber-50 border-amber-300 text-amber-900' :
                                                        'bg-slate-50 border-slate-200 text-slate-700'
                                                    }`}>
                                                        <span className="text-[9px] uppercase font-bold text-slate-500 block">
                                                            Visibilidade
                                                        </span>
                                                        <span className="text-xl font-black block my-0.5">
                                                            {effVis !== null ? (effVis >= 9999 ? '≥10km' : `${effVis}m`) : '--'}
                                                        </span>
                                                        <span className="text-[9px] text-slate-500 block truncate">
                                                            Mín: <strong className="text-slate-900">{apch?.minVis ?? '--'}m</strong>
                                                        </span>
                                                    </div>

                                                    {/* TETO */}
                                                    <div className={`p-2 rounded-lg border flex flex-col justify-between ${
                                                        item.ceilRed ? 'bg-red-50 border-red-300 text-red-900' :
                                                        item.ceilAmb ? 'bg-amber-50 border-amber-300 text-amber-900' :
                                                        'bg-slate-50 border-slate-200 text-slate-700'
                                                    }`}>
                                                        <span className="text-[9px] uppercase font-bold text-slate-500 block">
                                                            Teto Nuvens
                                                        </span>
                                                        <span className="text-xl font-black block my-0.5">
                                                            {ceiling !== null ? `${ceiling}ft` : (isCavok ? 'CAVOK' : 'S/T')}
                                                        </span>
                                                        <span className="text-[9px] text-slate-500 block truncate">
                                                            Mín: <strong className="text-slate-900">{apch?.minCeiling ?? '--'}ft</strong>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Bottom: Raw METAR String (Compact) */}
                                            <div className="pt-2 border-t border-slate-200">
                                                <div className="bg-slate-50 p-2 rounded-lg border border-slate-200 font-mono text-[10px] text-slate-700 leading-snug break-words select-text">
                                                    <span className="text-blue-600 font-bold mr-1.5">METAR:</span>
                                                    {metar || 'Sem dados METAR reportados'}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StandaloneWallboardApp />);
    </script>
</body>
</html>
