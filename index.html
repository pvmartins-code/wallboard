                                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-blue-950 border border-blue-800 text-blue-300 font-bold">
                                        LIVE
                                    </span>
                                </div>
                                <p className="text-[10px] text-slate-400 font-mono">Painel de Alertas Operacionais RAA</p>
                            </div>
                        </div>

                        {/* Centered Large High-Contrast Clock & Auto-Sync badge */}
                        <div className="flex items-center gap-3">
                            <div className="bg-slate-950 px-5 py-1.5 rounded-xl border border-slate-800 font-mono shadow-inner flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                <span className="text-lg md:text-xl font-black text-sky-400 tracking-wider">
                                    {timeStr.fullClock || timeStr.zulu}
                                </span>
                            </div>
                            <div className="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 font-mono text-[11px] text-emerald-400" title="Atualização automática a cada 60s">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>AUTO-SYNC 60s ({nextUpdateSeconds !== undefined ? `${nextUpdateSeconds}s` : '60s'})</span>
                            </div>
                        </div>

                        {/* Actions */}
                        <div className="flex items-center gap-3">
                            <button
                                onClick={() => setAudioEnabled(v => !v)}
                                className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border transition-colors cursor-pointer ${
                                    audioEnabled ? 'bg-emerald-950 border-emerald-700 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'
                                }`}
                                title={audioEnabled ? "Áudio Ativo" : "Silenciado"}
                            >
                                {audioEnabled ? <Icons.Volume2 /> : <Icons.VolumeX />}
                                <span className="font-mono text-[11px]">{audioEnabled ? "SOM ON" : "MUDO"}</span>
                            </button>

                            <button
                                onClick={toggleFullscreen}
                                className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer"
                                title="Ecrã Inteiro (F11)"
                            >
                                <Icons.Maximize />
                            </button>

                            <button
                                onClick={onExit}
                                className="flex items-center gap-2 px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-colors cursor-pointer shadow-md"
                            >
                                <Icons.ArrowLeft />
                                <span>Voltar ao Menu</span>
                            </button>
                        </div>
                    </header>

                    {/* MAIN DISPLAY: ZERO NOISE & NO ALTERNATES */}
                    {activeAlerts.length === 0 ? (
                        /* STATE 1: NADA A REPORTAR (SEM AEROPORTOS GREEN LISTADOS) */
                        <div className="flex-1 flex flex-col items-center justify-center bg-slate-900/60 border border-slate-800/80 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
                            <div className="absolute inset-0 bg-emerald-500/5 pointer-events-none"></div>

                            <div className="relative z-10 flex flex-col items-center max-w-xl mx-auto space-y-6">
                                {/* Big Green Status Circle */}
                                <div className="w-28 h-28 rounded-full bg-emerald-950/90 border-2 border-emerald-500 flex items-center justify-center text-emerald-400 shadow-2xl shadow-emerald-950/90">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <polyline points="20 6 9 17 4 12" />
                                    </svg>
                                </div>

                                <div className="space-y-2">
                                    <h2 className="text-4xl sm:text-6xl font-black text-white tracking-tight">
                                        NADA A REPORTAR
                                    </h2>
                                    <p className="text-lg text-emerald-400 font-bold">
                                        Todos os 9 aeródromos dentro dos limites regulamentares.
                                    </p>
                                </div>

                                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl px-6 py-4 w-full text-center">
                                    <p className="text-xs text-slate-400 font-mono">
                                        Sem limites de vento, visibilidade ou teto excedidos no arquipélago dos Açores.
                                    </p>
                                    <div className="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-center gap-4 text-xs font-mono">
                                        <span className="text-emerald-400 font-bold flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                            9 AEROPORTOS DENTRO DOS LIMITES
                                        </span>
                                        <span className="text-slate-600">•</span>
                                        <span className="text-slate-400">0 FORA DE LIMITES</span>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 text-xs font-mono text-slate-400">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                    <span>Vigilância contínua do OCC ativa em tempo real</span>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* STATE 2: ALERTA ATIVO (APENAS AEROPORTOS COM ALERTA • SEM ALTERNANTES RECOMENDADOS) */
                        <div className="flex-1 flex flex-col min-h-0 space-y-4">
                            {/* Summary Bar */}
                            <div className={`p-4 rounded-2xl border-2 flex items-center justify-between flex-shrink-0 shadow-lg ${
                                redAlerts.length > 0 
                                    ? 'bg-red-950/80 border-red-600 text-white animate-pulse' 
                                    : 'bg-amber-950/80 border-amber-600 text-white'
                            }`}>
                                <div className="flex items-center gap-3">
                                    <span className="text-3xl font-black font-mono">
                                        {redAlerts.length > 0 ? "⚠️" : "⚡"}
                                    </span>
                                    <div>
                                        <h2 className="text-lg font-black tracking-wide uppercase">
                                            {redAlerts.length > 0 
                                                ? `ALERTA OPERACIONAL: ${redAlerts.length} AERÓDROMO(S) FORA DOS LIMITES` 
                                                : `AVISO OPERACIONAL: ${amberAlerts.length} AERÓDROMO(S) PRÓXIMO DOS LIMITES`}
                                        </h2>
                                        <p className="text-xs opacity-90 font-mono">
                                            Exibindo exclusivamente os aeródromos afetados para intervenção operacional do OCC.
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 font-mono">
                                    {activeAlerts.map(a => (
                                        <strong 
                                            key={a.airport.code} 
                                            className={`px-3.5 py-1.5 rounded-xl text-base font-black border shadow-sm ${
                                                a.isRed 
                                                    ? 'bg-red-600 text-white border-red-400' 
                                                    : 'bg-amber-500 text-slate-950 border-amber-400'
                                            }`}
                                        >
                                            {a.airport.code}
                                        </strong>
                                    ))}
                                </div>
                            </div>

                            {/* Clean Grid of Affected Airports (No Alternates) */}
                            <div className={`flex-1 grid gap-4 overflow-y-auto custom-scroll ${
                                activeAlerts.length === 1 
                                    ? 'grid-cols-1 max-w-4xl mx-auto w-full' 
                                    : activeAlerts.length === 2 
                                    ? 'grid-cols-1 md:grid-cols-2' 
                                    : 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3'
                            }`}>
                                {activeAlerts.map(item => {
                                    const { airport, isRed, isAmber, maxWindSpd, matchedLimit, effVis, ceiling, isCavok, apch, metar } = item;

                                    return (
                                        <div
                                            key={airport.code}
                                            className={`rounded-2xl border-2 p-6 flex flex-col justify-between shadow-2xl transition-all ${
                                                isRed 
                                                    ? 'bg-red-950/40 border-red-500 ring-2 ring-red-500/40' 
                                                    : 'bg-amber-950/30 border-amber-500 ring-1 ring-amber-500/30'
                                            }`}
                                        >
                                            <div>
                                                {/* Header: Huge IATA code + Airport Name & Status */}
                                                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                                                    <div className="flex items-center gap-4">
                                                        <span className="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center font-mono font-black text-3xl text-white shadow-lg">
                                                            {airport.code}
                                                        </span>
                                                        <div>
                                                            <div className="flex items-baseline gap-2">
                                                                <h3 className="text-2xl font-black text-white tracking-tight">
                                                                    {airport.name}
                                                                </h3>
                                                                <span className="text-sm font-bold text-slate-400 uppercase">
                                                                    ({airport.island})
                                                                </span>
                                                            </div>
                                                            <span className="text-xs font-mono text-slate-400">
                                                                {airport.icao} • RWY {apch?.rwy ?? '--'}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    <span className={`px-4 py-2 rounded-xl font-mono font-black text-sm uppercase tracking-wider ${
                                                        isRed ? 'bg-red-600 text-white animate-pulse' : 'bg-amber-500 text-slate-950'
                                                    }`}>
                                                        {isRed ? 'RED (FORA DE LIMITES)' : 'AMBER (AVISO)'}
                                                    </span>
                                                </div>

                                                {/* 3 Main Parameter Indicators: Wind, Vis, Ceiling */}
                                                <div className="grid grid-cols-3 gap-3 my-5 font-mono text-center">
                                                    {/* VENTO */}
                                                    <div className={`p-4 rounded-xl border flex flex-col justify-between ${
                                                        item.windRed ? 'bg-red-950/80 border-red-600 text-white' :
                                                        item.windAmb ? 'bg-amber-950/80 border-amber-600 text-white' :
                                                        'bg-slate-950 border-slate-800 text-slate-300'
                                                    }`}>
                                                        <span className="text-xs uppercase font-bold text-slate-400 block mb-1">
                                                            Vento Máx
                                                        </span>
                                                        <span className="text-3xl font-black block my-1">
                                                            {maxWindSpd > 0 ? `${maxWindSpd}kt` : '--'}
                                                        </span>

                                                        item.visRed ? 'bg-red-950/80 border-red-600 text-white' :
                                                        item.visAmb ? 'bg-amber-950/80 border-amber-600 text-white' :
                                                        'bg-slate-950 border-slate-800 text-slate-300'
                                                    }`}>
                                                        <span className="text-xs uppercase font-bold text-slate-400 block mb-1">
                                                            Visibilidade
                                                        </span>
                                                        <span className="text-3xl font-black block my-1">
                                                            {effVis !== null ? (effVis >= 9999 ? '≥10km' : `${effVis}m`) : '--'}
                                                        </span>
                                                        <span className="text-xs text-slate-400 block">
                                                            Mínimo: <strong className="text-white">{apch?.minVis ?? '--'}m</strong>
                                                        </span>
                                                    </div>

                                                    {/* TETO */}
                                                    <div className={`p-4 rounded-xl border flex flex-col justify-between ${
                                                        item.ceilRed ? 'bg-red-950/80 border-red-600 text-white' :
                                                        item.ceilAmb ? 'bg-amber-950/80 border-amber-600 text-white' :
                                                        'bg-slate-950 border-slate-800 text-slate-300'
                                                    }`}>
                                                        <span className="text-xs uppercase font-bold text-slate-400 block mb-1">
                                                            Teto Nuvens
                                                        </span>
                                                        <span className="text-3xl font-black block my-1">
                                                            {ceiling !== null ? `${ceiling}ft` : (isCavok ? 'CAVOK' : 'S/T')}
                                                        </span>
                                                        <span className="text-xs text-slate-400 block">
                                                            Mínimo: <strong className="text-white">{apch?.minCeiling ?? '--'}ft</strong>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Bottom: Raw METAR String (No Alternates) */}
                                            <div className="pt-3 border-t border-slate-800">
                                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 font-mono text-xs text-slate-300 leading-relaxed break-words select-text">
                                                    <span className="text-blue-400 font-bold mr-2">METAR:</span>
                                                    {metar || 'Sem dados METAR reportados'}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- COMPONENT: REPRESENTAÇÃO CIRCULAR SECCIONADA DE 10° EM 10° DOS LIMITES DE VENTO ---
        const CircularWindChart = ({ airport, windLimitsData }) => {
            const [hoveredDeg, setHoveredDeg] = useState(null);
            const airportLimits = windLimitsData[airport.code] || {};

            const cx = 200;
            const cy = 200;
            const rBase = 65;
            const rMax = 175;

            // Runway orientation headings
            const rwy1 = airport.rwy;
            const rwy2 = (airport.rwy + 180) % 360;

            // Polar coordinates helper
            const getCoord = (cx, cy, r, angleDeg) => {
                const rad = (angleDeg - 90) * Math.PI / 180.0;
                return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
            };

            // Describe a pie/sector wedge between angle1 and angle2 from rIn to rOut
            const describeSector = (angle1, angle2, rIn, rOut) => {
                const p1 = getCoord(cx, cy, rOut, angle1);
                const p2 = getCoord(cx, cy, rOut, angle2);
                const p3 = getCoord(cx, cy, rIn, angle2);
                const p4 = getCoord(cx, cy, rIn, angle1);
                return `M ${p1.x} ${p1.y} A ${rOut} ${rOut} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rIn} ${rIn} 0 0 0 ${p4.x} ${p4.y} Z`;
            };

            // 36 sectors (10 to 360 step 10)
            const sectors = Array.from({ length: 36 }, (_, i) => (i + 1) * 10);

            // Active or hovered details
            const activeHeading = hoveredDeg !== null ? hoveredDeg : rwy1;
            const activeData = airportLimits[activeHeading] || {};

            return (
                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col items-center">
                    <div className="w-full flex items-center justify-between pb-2 mb-2 border-b border-slate-800 text-xs">
                        <div>
                            <span className="font-bold text-white uppercase text-[11px] tracking-wider">
                                Rosa dos Ventos dos Limites ({airport.code} - {airport.name})
                            </span>
                            <span className="text-[10px] text-slate-400 block">
                                36 setores seccionados de 10° em 10° com limites Dry / Wet
                            </span>
                        </div>
                        <div className="text-right">
                            <span className="text-[10px] text-slate-400 font-mono">Pista: {runwayNumber(rwy1)} / {runwayNumber(rwy2)}</span>
                        </div>
                    </div>

                    <div className="relative w-[340px] h-[340px] sm:w-[380px] sm:h-[380px]">
                        <svg viewBox="0 0 400 400" className="w-full h-full drop-shadow-md select-none">
                            {/* Background concentric reference rings: 10kt, 20kt, 30kt, 40kt */}
                            {[10, 20, 30, 40].map(spd => {
                                const r = rBase + (spd / 40) * (rMax - rBase);
                                return (
                                    <g key={spd}>
                                        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#334155" strokeWidth="0.8" strokeDasharray="3 3" />
                                        <text x={cx + 3} y={cy - r + 9} fill="#64748b" fontSize="8" fontFamily="monospace">{spd}kt</text>
                                    </g>
                                );
                            })}

                            {/* 36 Sectors of 10° each */}
                            {sectors.map(deg => {
                                const data = airportLimits[deg] || {};
                                const dry = data.dry ?? 30;
                                const wet = data.wet;
                                const rOut = rBase + (dry / 40) * (rMax - rBase);
                                const isHovered = hoveredDeg === deg;

                                // Sector color coding
                                let fill = '#0284c7'; // Sky default
                                if (dry >= 40) fill = '#10b981'; // 40kt Emerald
                                else if (dry >= 34) fill = '#0ea5e9'; // 34-37kt Sky
                                else if (dry >= 30) fill = '#6366f1'; // 30-32kt Indigo
                                else if (dry >= 20) fill = '#f59e0b'; // 20-25kt Amber
                                else fill = '#f43f5e'; // <20kt Rose (tight limit)

                                const angle1 = deg - 4.5;
                                const angle2 = deg + 4.5;

                                return (
                                    <g 
                                        key={deg}
                                        onMouseEnter={() => setHoveredDeg(deg)}
                                        onMouseLeave={() => setHoveredDeg(null)}
                                        className="cursor-pointer transition-all"
                                    >
                                        <path
                                            d={describeSector(angle1, angle2, rBase, rOut)}
                                            fill={fill}
                                            fillOpacity={isHovered ? "1" : "0.75"}
                                            stroke={isHovered ? "#ffffff" : "#0f172a"}
                                            strokeWidth={isHovered ? "2" : "0.8"}
                                        />
                                    </g>
                                );
                            })}

                            {/* Radial 10° tick marks & Cardinal Directions */}
                            {sectors.map(deg => {
                                const pOuter = getCoord(cx, cy, rMax + 12, deg);
                                const isCardinal = deg % 90 === 0;
                                const cardinalLabel = deg === 360 ? "N" : deg === 90 ? "E" : deg === 180 ? "S" : deg === 270 ? "W" : null;
                                return (
                                    <g key={`tick-${deg}`}>
                                        {cardinalLabel ? (
                                            <text 
                                                x={pOuter.x} 
                                                y={pOuter.y} 
                                                fill="#f8fafc" 
                                                fontSize="12" 
                                                fontWeight="bold" 
                                                textAnchor="middle" 
                                                dominantBaseline="central"
                                                fontFamily="monospace"
                                            >
                                                {cardinalLabel}
                                            </text>
                                        ) : deg % 30 === 0 ? (
                                            <text 
                                                x={pOuter.x} 
                                                y={pOuter.y} 
                                                fill="#64748b" 
                                                fontSize="8" 
                                                textAnchor="middle" 
                                                dominantBaseline="central"
                                                fontFamily="monospace"
                                            >
                                                {fmtDir(deg)}
                                            </text>
                                        ) : null}
                                    </g>
                                );
                            })}

                            {/* Runway Heading Line overlaid through center */}
                            <g transform={`rotate(${airport.rwy - 90} ${cx} ${cy})`}>
                                <line x1={cx - 75} y1={cy} x2={cx + 75} y2={cy} stroke="#ffffff" strokeWidth="8" strokeLinecap="round" opacity="0.9" />
                                <line x1={cx - 70} y1={cy} x2={cx + 70} y2={cy} stroke="#0f172a" strokeWidth="2" strokeDasharray="6 4" />
                            </g>

                            {/* Center Hub displaying selected sector stats */}
                            <circle cx={cx} cy={cy} r={rBase - 3} fill="#090d16" stroke="#334155" strokeWidth="2" />
                            <text x={cx} y={cy - 20} fill="#94a3b8" fontSize="9" textAnchor="middle" fontWeight="bold" fontFamily="monospace">
                                RUMO {fmtDir(activeHeading)}°
                            </text>
                            <text x={cx} y={cy} fill="#38bdf8" fontSize="16" textAnchor="middle" fontWeight="black" fontFamily="monospace">
                                {activeData.dry ?? '--'}kt
                            </text>
                            <text x={cx} y={cy + 16} fill={activeData.wet ? "#38bdf8" : "#64748b"} fontSize="9" textAnchor="middle" fontWeight="semibold" fontFamily="monospace">
                                {activeData.wet ? `💧 ${activeData.wet}kt` : "💧 Seco"}
                            </text>
                            <text x={cx} y={cy + 30} fill="#64748b" fontSize="8" textAnchor="middle" fontFamily="sans-serif">
                                RWY {runwayNumber(rwy1)}/{runwayNumber(rwy2)}
                            </text>
                        </svg>
                    </div>

                    {/* Color Legend & Info */}
                    <div className="w-full mt-2 pt-2 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[10px] text-slate-400 font-mono">
                        <div className="flex items-center gap-2">
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></span> 40kt</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-sky-500 inline-block"></span> 34-37kt</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-indigo-500 inline-block"></span> 30-32kt</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-amber-500 inline-block"></span> 20-25kt</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-rose-500 inline-block"></span> 10-18kt</span>
                        </div>
                        <span className="text-slate-400 text-[10px]">Passe o cursor sobre os setores para inspecionar</span>
                    </div>
                </div>
            );
        };

        // --- COMPONENT: TABELA DE MÍNIMOS & LIMITES DE VENTO (COM REPRESENTAÇÃO CIRCULAR SECCIONADA) ---
        const MinimaAndWindLimitsView = ({ airports, windLimitsData, approachLimitsData, onNavigateAdmin }) => {
            const [selectedCode, setSelectedCode] = useState("PDL");
            const selectedAirport = airports.find(a => a.code === selectedCode) || airports[0];
            const airportLimits = windLimitsData[selectedAirport.code] || {};
            const approachList = approachLimitsData[selectedAirport.code] || [];

            return (
                <div className="flex-1 overflow-y-auto p-4 custom-scroll space-y-5 max-w-6xl mx-auto">
                    {/* Header Banner */}
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div>
                            <div className="flex items-center gap-2 mb-1">
                                <span className="px-2 py-0.5 rounded bg-blue-900/60 border border-blue-700/60 text-blue-300 font-mono text-[10px] font-bold uppercase tracking-wider">
                                    AIP Portugal • Limites Operacionais
                                </span>
                                <span className="text-slate-400 text-xs">• 9 Ilhas dos Açores</span>
                            </div>
                            <h2 className="text-xl font-bold text-white tracking-tight">
                                Mínimos de Aproximação & Limites de Vento Seccionados
                            </h2>
                            <p className="text-xs text-slate-400 mt-0.5">
                                Representação circular seccionada de 10° em 10° dos limites de vento e tabela de mínimos IFR/VFR.
                            </p>
                        </div>
                        <button 
                            onClick={onNavigateAdmin}
                            className="flex items-center gap-2 px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold transition-colors cursor-pointer shadow-sm"
                        >
                            <Icons.Settings />
                            <span>Editar Limites (Admin)</span>
                        </button>
                    </div>

                    {/* Airport Selection Bar */}
                    <div className="bg-slate-900/80 border border-slate-800 p-2.5 rounded-2xl flex items-center gap-2 overflow-x-auto custom-scroll shadow-md">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 flex-shrink-0">
                            Aeródromo:
                        </span>
                        {airports.map(ap => {
                            const isSel = ap.code === selectedCode;
                            return (
                                <button
                                    key={ap.code}
                                    onClick={() => setSelectedCode(ap.code)}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold font-mono transition-all cursor-pointer flex-shrink-0 flex items-center gap-2 ${
                                        isSel 
                                            ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40 ring-2 ring-blue-400' 
                                            : 'bg-slate-950 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800'
                                    }`}
                                >
                                    <span className="font-black text-sm">{ap.code}</span>
                                    <span className="text-[10px] font-normal opacity-85">{ap.island}</span>
                                </button>
                            );
                        })}
                    </div>

                    {/* SPOTLIGHT: Circular Wind Chart + Selected Airport Minima & Sector Breakdown */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                        {/* Circular Wind Chart (6 cols) */}
                        <div className="lg:col-span-6 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col justify-center">
                            <CircularWindChart 
                                airport={selectedAirport} 
                                windLimitsData={windLimitsData} 
                            />
                        </div>

                        {/* Approach Minima & Sector Limits Breakdown (6 cols) */}
                        <div className="lg:col-span-6 space-y-4">
                            {/* Selected Airport Minima Card */}
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                                    <div>
                                        <span className="text-[10px] font-mono text-blue-400 uppercase font-bold tracking-wider">
                                            {selectedAirport.icao} • ELEV {selectedAirport.elev} FT
                                        </span>
                                        <h3 className="text-sm font-bold text-white">
                                            Mínimos de Aproximação — {selectedAirport.name}
                                        </h3>
                                    </div>
                                    <span className="text-xs font-mono font-bold px-2 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700">
                                        RWY {runwayNumber(selectedAirport.rwy)} / {runwayNumber((selectedAirport.rwy + 180) % 360)}
                                    </span>
                                </div>

                                <div className="overflow-x-auto rounded-xl border border-slate-800">
                                    <table className="w-full text-left text-xs font-mono">
                                        <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] border-b border-slate-800">
                                            <tr>
                                                <th className="py-2 px-3">Pista</th>
                                                <th className="py-2 px-3">Aproximação</th>
                                                <th className="py-2 px-3 text-right">VIS / RVR Min</th>
                                                <th className="py-2 px-3 text-right">Teto BKN Min</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800 bg-slate-950/40">
                                            {approachList.length > 0 ? (
                                                approachList.map((item) => (
                                                    <tr key={item.rwy} className="hover:bg-slate-800/40">
                                                        <td className="py-2 px-3 font-bold text-white">RWY {item.displayRwy || item.rwy}</td>
                                                        <td className="py-2 px-3 text-slate-300 font-medium">{item.apch}</td>
                                                        <td className="py-2 px-3 text-right font-bold text-blue-400">
                                                            {item.minVis >= 1000 ? `${(item.minVis / 1000).toFixed(1)} km` : `${item.minVis} m`}
                                                            {item.note && <span className="text-amber-400 ml-1 font-normal">{item.note}</span>}
                                                        </td>
                                                        <td className="py-2 px-3 text-right font-bold text-indigo-400">
                                                            {item.minCeiling} ft
                                                            {item.note && <span className="text-amber-400 ml-1 font-normal">{item.note}</span>}
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan="4" className="py-3 px-4 text-center text-slate-500">Sem dados cadastrados</td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Compact Grid of the 36 Wind Limit Sectors (10° a 360°) */}
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
                                <div className="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-800 text-xs">
                                    <div>
                                        <span className="font-bold text-white uppercase text-[11px] tracking-wider block">
                                            Limites dos 36 Setores ({selectedAirport.code})
                                        </span>
                                        <span className="text-[10px] text-slate-400">
                                            Seccionados de 10° em 10°
                                        </span>
                                    </div>
                                    <span className="text-[10px] text-sky-400 font-mono font-semibold">Seco / 💧 Molhado (kt)</span>
                                </div>

                                <div className="grid grid-cols-4 sm:grid-cols-6 gap-1.5 max-h-[220px] overflow-y-auto custom-scroll p-1">
                                    {Array.from({ length: 36 }, (_, i) => (i + 1) * 10).map(deg => {
                                        const lim = airportLimits[deg] || {};
                                        const dry = lim.dry ?? 30;
                                        const wet = lim.wet;
                                        return (
                                            <div 
                                                key={deg} 
                                                className="bg-slate-950/80 border border-slate-800 rounded-lg p-1.5 text-center font-mono text-[10px] hover:border-blue-500 transition-colors"
                                            >
                                                <div className="text-slate-400 font-semibold">{fmtDir(deg)}°</div>
                                                <div className="font-bold text-sky-400 text-xs">{dry}kt</div>
                                                <div className={`text-[9px] ${wet ? 'text-blue-300' : 'text-slate-600'}`}>
                                                    {wet ? `💧${wet}` : '-'}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            // View navigation: "dashboard" | "live_weather" | "minima_table" | "inspector" | "admin"
            const [currentView, setCurrentView] = useState("dashboard");

            // Theme mode: "light" (default priority) | "dark"
            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem("raa_theme_v2");
                if (saved) return saved;
                return "light";
            });

            useEffect(() => {
                if (theme === "light") {
                    document.body.classList.add("light-mode");
                } else {
                    document.body.classList.remove("light-mode");
                }
                localStorage.setItem("raa_theme_v2", theme);
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => prev === "dark" ? "light" : "dark");
            };

            // Alert toggles
            const [alertWindEnabled, setAlertWindEnabled] = useState(true);
            const [alertVisCeilingEnabled, setAlertVisCeilingEnabled] = useState(true);

            // Persistent Limits Storage
            const [windLimitsData, setWindLimitsData] = useState(() => {
                const saved = localStorage.getItem("raa_wind_limits");
                return saved ? JSON.parse(saved) : defaultWindLimits;
            });

            const [approachLimitsData, setApproachLimitsData] = useState(() => {
                const saved = localStorage.getItem("raa_apch_limits");
                return saved ? JSON.parse(saved) : defaultApproachLimits;
            });

            // Master METARs state (polling all 9 airports every 60s)
            const [allMetarData, setAllMetarData] = useState({});
            const [refreshCounter, setRefreshCounter] = useState(0);
            const [lastUpdated, setLastUpdated] = useState(() => new Date());
            const [secondsToNextRefresh, setSecondsToNextRefresh] = useState(60);

            // 1-second countdown ticker for reliable 60s auto-refresh visual verification
            useEffect(() => {
                const ticker = setInterval(() => {
                    setSecondsToNextRefresh(prev => (prev <= 1 ? 60 : prev - 1));
                }, 1000);
                return () => clearInterval(ticker);
            }, []);

            // Polling loop every 60 seconds
            useEffect(() => {
                let mounted = true;
                const fetchAll = async () => {
                    const next = {};
                    await Promise.all(
                        initialAirports.map(async (ap) => {
                            try {
                                const res = await fetch(`https://metar.vatsim.net/${ap.icao}?t=${Date.now()}`);
                                const text = await res.text();
                                if (!text || text.trim().length < 10) throw new Error("Empty");
                                next[ap.icao] = { metar: text.trim(), error: false, loading: false };
                            } catch (e) {
                                next[ap.icao] = { metar: allMetarData[ap.icao]?.metar || null, error: true, loading: false };
                            }
                        })
                    );
                    if (mounted) {
                        setAllMetarData(prev => ({ ...prev, ...next }));
                        setLastUpdated(new Date());
                        setSecondsToNextRefresh(60);
                    }
                };

                fetchAll();
                const timer = setInterval(fetchAll, 60000);
                return () => { mounted = false; clearInterval(timer); };
            }, [refreshCounter]);

            const handleSaveWindLimits = (newData) => {
                setWindLimitsData(newData);
                localStorage.setItem("raa_wind_limits", JSON.stringify(newData));
            };

            const handleSaveApproachLimits = (newData) => {
                setApproachLimitsData(newData);
                localStorage.setItem("raa_apch_limits", JSON.stringify(newData));
            };

            const handleResetDefaults = () => {
                setWindLimitsData(defaultWindLimits);
                setApproachLimitsData(defaultApproachLimits);
                localStorage.removeItem("raa_wind_limits");
                localStorage.removeItem("raa_apch_limits");
            };

            // FULLSCREEN OCC TV NOTIFICATIONS WALLBOARD (No sidebar, pure operational alerts & real-time monitoring)
            if (currentView === "tv_wallboard") {
                return (
                    <TVWallboardView 
                        airports={initialAirports}
                        allMetarData={allMetarData}
                        windLimitsData={windLimitsData}
                        approachLimitsData={approachLimitsData}
                        alertWindEnabled={alertWindEnabled}
                        alertVisCeilingEnabled={alertVisCeilingEnabled}
                        onExit={() => setCurrentView("dashboard")}
                        theme={theme}
                        onToggleTheme={toggleTheme}
                        lastUpdated={lastUpdated}
                        nextUpdateSeconds={secondsToNextRefresh}
                        onRefreshMetar={() => setRefreshCounter(c => c + 1)}
                    />
                );
